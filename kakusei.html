<style>
/* 縦長(9:16)の3D画面：教室のオープニング → 屋上から校庭を見下ろすバトル */
:root{--bg:#07090f;--screen:#141826;--fg:#f1f3f8;--line:#2c3248;--accent:#ffcf33;--magic:#7ee8ff;--danger:#ff4d5e;--good:#7dffb0;
  --font-display:"Dela Gothic One","Zen Kaku Gothic New",system-ui,sans-serif;
  --font-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --font-mincho:"Zen Old Mincho","Hiragino Mincho ProN","Yu Mincho",serif;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);display:grid;place-items:center;
  padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.screen{height:min(100%,860px);aspect-ratio:9/16;max-width:100%;background:var(--screen);border-radius:18px;
  display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.6)}
@media (max-width:520px){body{padding:0}.screen{height:100%;width:100%;aspect-ratio:auto;border-radius:0;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}}
.bar{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.bar a{color:var(--fg);text-decoration:none;font-size:14px;padding:6px 12px;border-radius:99px;background:var(--line)}
.bar a:focus-visible,.mute:focus-visible{outline:2px solid var(--accent)}
.ttl{font-family:var(--font-mincho);font-weight:900;font-size:18px;margin:0;white-space:nowrap}
.no{margin-left:auto;font-size:11px;opacity:.6;letter-spacing:.1em}
.mute{all:unset;cursor:pointer;font-size:12px;padding:5px 10px;border-radius:99px;border:1px solid var(--line);white-space:nowrap}

.stage{flex:1;min-height:0;position:relative;user-select:none;-webkit-user-select:none;touch-action:none;background:#000;cursor:crosshair;overflow:hidden}
.stage:focus-visible{outline:3px solid var(--accent);outline-offset:-4px}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.vig{position:absolute;inset:0;pointer-events:none;opacity:0;box-shadow:inset 0 0 80px 30px rgba(255,40,60,.75)}
.dream{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity 1.2s;
  box-shadow:inset 0 0 70px 26px rgba(255,200,250,.55);background:radial-gradient(ellipse at center,transparent 58%,rgba(210,180,255,.28))}
.dream.on{opacity:1}
.rule{justify-self:end;text-align:right;font-size:11px;font-weight:700;line-height:1.35;letter-spacing:.06em;color:#fff}
.rule b{color:var(--danger)}
.top{position:absolute;top:10px;left:12px;right:12px;display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:8px;pointer-events:none;
  text-shadow:0 2px 0 rgba(0,0,0,.55);font-variant-numeric:tabular-nums}
.top .t{font-family:var(--font-display);font-size:22px;line-height:1}
.top .t small,.top .k small{display:block;font-family:var(--font-body);font-weight:700;font-size:10px;letter-spacing:.14em;opacity:.85}
.top .k{font-family:var(--font-display);font-size:30px;line-height:1;text-align:center;color:#fff}
.hp{justify-self:end;width:min(36vw,140px)}
.hp small{display:block;font-weight:700;font-size:10px;letter-spacing:.14em;text-align:right;opacity:.85}
.hp .bar2{height:10px;border-radius:99px;background:rgba(0,0,0,.45);box-shadow:inset 0 0 0 1px rgba(255,255,255,.35);overflow:hidden;margin-top:3px}
.hp i{display:block;height:100%;width:100%;background:var(--good);border-radius:99px;transition:width .2s,background .3s}
.combo{position:absolute;top:66px;left:0;right:0;text-align:center;font-family:var(--font-display);font-size:20px;color:var(--accent);text-shadow:0 2px 0 #000;pointer-events:none;opacity:0}
.combo.on{animation:cpop .5s ease-out forwards}
@keyframes cpop{0%{opacity:1;transform:scale(1.5)}30%{transform:scale(1)}80%{opacity:1}100%{opacity:0}}
.banner{position:absolute;top:36%;left:0;right:0;text-align:center;font-family:var(--font-display);font-size:clamp(34px,11vw,58px);color:#fff;
  text-shadow:0 4px 0 #1f2430,0 0 24px rgba(126,232,255,.8);pointer-events:none;opacity:0;letter-spacing:.06em}
.banner small{display:block;font-family:var(--font-mincho);font-weight:900;font-size:18px;letter-spacing:.1em;margin-top:6px;color:var(--accent)}
.banner.on{animation:ban 1.5s ease-out forwards}
@keyframes ban{0%{opacity:0;transform:scale(2.2)}12%{opacity:1;transform:scale(1)}78%{opacity:1}100%{opacity:0;transform:scale(1.05)}}
.gauge{position:absolute;left:12px;bottom:14px;width:46%;pointer-events:none}
.gauge small{display:block;font-size:10px;font-weight:700;letter-spacing:.14em;text-shadow:0 1px 2px #000;opacity:.9}
.gauge .bar2{height:8px;border-radius:99px;background:rgba(0,0,0,.45);box-shadow:inset 0 0 0 1px rgba(255,255,255,.3);overflow:hidden;margin-top:3px}
.gauge i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7ee8ff,#ffcf33);border-radius:99px}
.special{position:absolute;right:12px;bottom:12px;font:400 15px var(--font-display);letter-spacing:.04em;line-height:1.15;border:0;border-radius:16px;padding:10px 14px;cursor:pointer;
  background:linear-gradient(180deg,#ffe36b,#ff9f2f);color:#2a1300;box-shadow:0 4px 0 #8a4a0c,0 0 24px rgba(255,207,51,.8);animation:glow .8s ease-in-out infinite alternate;touch-action:manipulation}
.special small{display:block;font-family:var(--font-body);font-weight:700;font-size:10px;letter-spacing:.1em}
.special:focus-visible{outline:3px solid #fff;outline-offset:2px}
@keyframes glow{from{transform:scale(1)}to{transform:scale(1.06)}}
.skip{position:absolute;right:12px;top:12px;font:700 12px var(--font-body);border:1px solid rgba(255,255,255,.5);background:rgba(0,0,0,.35);color:#fff;border-radius:99px;padding:6px 12px;cursor:pointer}
.dist{position:absolute;top:22px;left:0;right:0;text-align:center;font-family:var(--font-display);font-size:clamp(34px,11vw,52px);
  color:#fff;text-shadow:0 3px 0 #1f2430,0 0 14px rgba(0,0,0,.5);font-variant-numeric:tabular-nums;pointer-events:none}
.dist small{display:block;font-family:var(--font-body);font-weight:700;font-size:13px;letter-spacing:.14em;opacity:.9}
.dist em{display:block;font-style:normal;font-family:var(--font-mincho);font-weight:900;font-size:17px;color:var(--accent);margin-top:4px}
.dist.slam{animation:slam .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes slam{0%{transform:scale(1.9);opacity:.2}100%{transform:scale(1);opacity:1}}
.hud{position:absolute;left:0;right:0;bottom:0;padding:44px 16px 14px;text-align:center;pointer-events:none;background:linear-gradient(transparent,rgba(7,9,15,.88))}
.msg{font-family:var(--font-display);font-size:clamp(19px,5.4vw,26px);letter-spacing:.04em;min-height:1.4em;text-shadow:0 2px 0 #000}
.rank{font-family:var(--font-mincho);font-weight:900;font-size:15px;color:var(--accent);min-height:1.5em;text-shadow:0 1px 0 #000}
.actions{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:10px;pointer-events:auto;animation:pop .35s ease-out}
.actions .row{display:flex;gap:10px;justify-content:center}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.btn{font:700 15px var(--font-body);border:0;border-radius:99px;padding:11px 20px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:focus-visible,.support:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn.x{background:#000;color:#fff;box-shadow:0 0 0 1px #555}
.btn.again{background:var(--accent);color:#1f2430}
.support{font-size:12px;color:var(--fg);opacity:.7;text-decoration:underline;text-underline-offset:3px}
@media (prefers-reduced-motion:reduce){.special,.actions,.dist.slam{animation:none}.banner.on,.combo.on{animation-duration:.01s}}
</style>

<body>
<main class="screen">
  <div class="bar">
    <a href="./">← 棚へ</a>
    <h1 class="ttl">三時間目の覚醒</h1>
    <span class="no">ひ-1-4</span>
    <button class="mute" id="mute" type="button" aria-pressed="false">音 ON</button>
  </div>
  <div class="stage" id="stage" tabindex="0" role="application" aria-label="三時間目の覚醒。タップした場所に魔法を撃つ">
    <div class="flash" id="flash"></div>
    <div class="vig" id="vig"></div>
    <div class="dream" id="dream"></div>
    <div class="top" id="top" hidden>
      <div class="t"><span id="time">60</span><small>残り秒</small></div>
      <div class="k"><span id="kills">0</span><small>撃退</small></div>
      <div class="hp" hidden><small>校舎の無事度 <b id="hpn">100</b>%</small><div class="bar2"><i id="hpbar"></i></div></div>
      <div class="rule">宇宙人を<br><b>1体でも</b>通したら<br>アウト</div>
    </div>

    <button class="special" id="special" type="button" hidden>黒板消しメテオ<small>必殺技 発動！</small></button>

</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const $=id=>document.getElementById(id);
const stage=$("stage"),msg=$("msg"),rankEl=$("rank"),topEl=$("top"),timeEl=$("time"),killsEl=$("kills"),hpnEl=$("hpn"),hpbar=$("hpbar"),
  comboEl=$("combo"),bannerEl=$("banner"),distEl=$("dist"),gaugeEl=$("gauge"),gbar=$("gbar"),specialBtn=$("special"),skipBtn=$("skip"),
  flashEl=$("flash"),vigEl=$("vig"),dreamEl=$("dream"),actions=$("actions"),shareA=$("share"),againBtn=$("again"),muteBtn=$("mute");
if(!window.THREE){msg.textContent="3Dを読み込めませんでした";rankEl.textContent="通信状態を確認して再読み込みしてください";return}

/* ---------- 記録 ---------- */
let bestK=null;
try{bestK=Number(localStorage.getItem("hb-kakusei-best"))||null}catch(e){}

/* ---------- 音（Web Audioで合成） ---------- */
const AC=window.AudioContext||window.webkitAudioContext;
let ac=null,master,bgmBus,sfxBus,noiseBuf,muted=false,comp;
try{muted=localStorage.getItem("hb-mute")==="1"}catch(e){}
function showMute(){muteBtn.textContent=muted?"音 OFF":"音 ON";muteBtn.setAttribute("aria-pressed",String(muted))}
showMute();
function initAudio(){
  if(!AC)return;
  if(ac){if(ac.state==="suspended")ac.resume();return}
  ac=new AC();
  comp=ac.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=4;comp.connect(ac.destination);
  master=ac.createGain();master.gain.value=muted?0:0.95;master.connect(comp);
  bgmBus=ac.createGain();bgmBus.gain.value=0.6;bgmBus.connect(master);
  sfxBus=ac.createGain();sfxBus.gain.value=0.75;sfxBus.connect(master);
  noiseBuf=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate);
  const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  startBgm();
}
muteBtn.addEventListener("pointerdown",e=>e.stopPropagation());
muteBtn.addEventListener("click",e=>{e.stopPropagation();muted=!muted;showMute();
  try{localStorage.setItem("hb-mute",muted?"1":"0")}catch(err){}
  initAudio();if(master)master.gain.setTargetAtTime(muted?0:0.95,ac.currentTime,0.02)});
function tone(f,t,dur,{type="sine",vol=0.3,to=null,bus=sfxBus,attack=0.005,lp=null}={}){
  if(!ac)return;const o=ac.createOscillator(),g=ac.createGain();o.type=type;
  o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+attack);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  let n=o;if(lp){const fl=ac.createBiquadFilter();fl.type="lowpass";fl.frequency.value=lp;o.connect(fl);n=fl}
  n.connect(g);g.connect(bus);o.start(t);o.stop(t+dur+0.02)}
function noise(t,dur,{vol=0.3,type="lowpass",f=1000,to=null,q=1,attack=0.005,bus=sfxBus}={}){
  if(!ac)return;const s=ac.createBufferSource(),fl=ac.createBiquadFilter(),g=ac.createGain();
  s.buffer=noiseBuf;s.loop=true;fl.type=type;fl.Q.value=q;fl.frequency.setValueAtTime(f,t);
  if(to)fl.frequency.exponentialRampToValueAtTime(to,t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+attack);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(fl);fl.connect(g);g.connect(bus);s.start(t);s.stop(t+dur+0.02)}
const T0=()=>ac?ac.currentTime:0;
let lastCast=0,lastPop=0;
const SE={
  rumble(){const t=T0();noise(t,2.6,{vol:0.55,f:140,to:60,attack:0.5});tone(48,t,2.6,{vol:0.3,attack:0.6})},
  ufo(){const t=T0();for(let i=0;i<3;i++)tone(600,t+i*0.5,0.5,{vol:0.07,to:900})},
  gasp(){const t=T0();tone(400,t,0.25,{type:"triangle",vol:0.15,to:900})},
  awaken(){const t=T0();noise(t,1.4,{vol:0.6,type:"bandpass",f:300,to:6000,q:0.6,attack:0.4});tone(80,t+1.3,1.4,{vol:0.6,to:40});noise(t+1.3,1.0,{vol:0.8,f:3000,to:200,attack:0.002});
    [330,392,494,659].forEach((f,i)=>tone(f,t+1.3+i*0.04,1.2,{type:"sawtooth",vol:0.08,lp:3000}))},
  cast(){const t=T0();if(t-lastCast<0.03)return;lastCast=t;tone(900,t,0.12,{type:"square",vol:0.07,to:2600,lp:5000});noise(t,0.06,{vol:0.12,type:"highpass",f:3000})},
  hit(){const t=T0();tone(320,t,0.1,{type:"square",vol:0.1,to:160,lp:2000});noise(t,0.08,{vol:0.2,f:1500})},
  pop(){const t=T0();if(t-lastPop<0.025)return;lastPop=t;tone(500+Math.random()*200,t,0.18,{type:"triangle",vol:0.2,to:1600});noise(t,0.12,{vol:0.22,type:"bandpass",f:2500,q:0.8})},
  combo(n){const t=T0();const f=523*Math.pow(2,Math.min(n,14)/12);tone(f,t,0.15,{type:"square",vol:0.06,lp:4000});tone(f*1.5,t+0.05,0.15,{vol:0.05})},
  wall(){const t=T0();tone(90,t,0.35,{vol:0.55,to:40});noise(t,0.5,{vol:0.45,f:900,to:200});noise(t+0.1,0.6,{vol:0.2,type:"highpass",f:2500})},
  ready(){const t=T0();[784,988,1319].forEach((f,i)=>tone(f,t+i*0.07,0.25,{type:"square",vol:0.08,lp:5000}))},
  meteor(){const t=T0();noise(t,1.2,{vol:0.5,type:"bandpass",f:3000,to:300,q:0.7,attack:0.1})},
  impact(){const t=T0();tone(70,t,0.4,{vol:0.6,to:35});noise(t,0.5,{vol:0.5,f:1200,to:150,attack:0.002})},
  wave(){const t=T0();for(let i=0;i<4;i++){tone(880,t+i*0.25,0.12,{type:"square",vol:0.08});tone(660,t+i*0.25+0.12,0.12,{type:"square",vol:0.08})}},
  chime(){const t=T0();[[659,0],[523,.5],[587,1],[392,1.5],[392,2.3],[587,2.8],[659,3.3],[523,3.8]].forEach(([f,d])=>{tone(f,t+d,1.4,{vol:0.22,attack:0.01});tone(f*2,t+d,0.7,{vol:0.05})})},
  beam(){const t=T0();tone(300,t,2.2,{vol:0.12,to:1200,attack:0.2});tone(310,t,2.2,{vol:0.1,to:1250,attack:0.2})},
  fanfare(){const t=T0();const m=[[523,0],[659,.12],[784,.24],[1047,.36],[988,.62],[1047,.74],[1319,.86]];
    m.forEach(([f,d])=>{tone(f,t+d,0.34,{type:"square",vol:0.1,lp:3500});tone(f/2,t+d,0.32,{type:"triangle",vol:0.16})})},
  collapse(){const t=T0();noise(t,2.4,{vol:0.8,f:600,to:60,attack:0.05});tone(55,t,2,{vol:0.5,to:30});for(let i=0;i<8;i++)noise(t+0.2+i*0.18,0.15,{vol:0.3,type:"highpass",f:2000})},
  sad(){const t=T0();[[392,0],[370,.35],[349,.7],[330,1.05]].forEach(([f,d])=>tone(f,t+d,0.6,{type:"sawtooth",vol:0.08,lp:1200}))}
};
/* BGM：授業中は眠いチャイム風、覚醒後はロック。時間とともに音が増え、ラスト10秒で最高潮 */
let bgmMode="class",gameT=0;
function startBgm(){
  const hz=m=>440*Math.pow(2,(m-69)/12);
  let next=ac.currentTime+0.1,step=0,lastMode="";
  const riff=[40,40,52,40,43,40,45,47, 40,40,52,40,50,47,45,43];
  const lead=[76,0,79,76,74,0,71,74, 76,0,79,81,83,0,81,79, 76,0,74,71,69,0,71,74, 76,79,83,86,83,0,79,0];
  const chords=[[52,55,59],[48,52,55],[50,54,57],[47,50,54]];
  setInterval(()=>{
    if(bgmMode!==lastMode){lastMode=bgmMode;step=0;next=Math.max(next,ac.currentTime+0.05)}
    while(next<ac.currentTime+0.3){
      let dur;
      if(bgmMode==="class"){dur=60/66/2;
        if(step%8===0)[57,60,64].forEach(m=>tone(hz(m),next,dur*7,{type:"triangle",vol:0.06,bus:bgmBus,attack:0.2}));
        if(step%2===0)tone(hz(45),next,dur*1.8,{type:"sine",vol:0.12,bus:bgmBus});
        if(step%4===3)noise(next,0.03,{vol:0.03,type:"highpass",f:6000,bus:bgmBus});
      }else if(bgmMode==="battle"||bgmMode==="last"){
        const last=bgmMode==="last";dur=60/(last?168:156)/2;
        const lv=last?4:Math.min(3,Math.floor(gameT/15));
        const b=riff[step%16];
        tone(hz(b),next,dur*0.9,{type:"sawtooth",vol:0.2,bus:bgmBus,lp:900+lv*250});
        tone(hz(b+7),next,dur*0.9,{type:"sawtooth",vol:0.1,bus:bgmBus,lp:900+lv*250});
        tone(hz(b-12),next,dur*0.95,{type:"triangle",vol:0.28,bus:bgmBus});
        if(step%4===0){tone(150,next,0.16,{vol:0.6,to:42,bus:bgmBus});noise(next,0.02,{vol:0.15,type:"highpass",f:3000,bus:bgmBus})}
        if(step%8===4){noise(next,0.16,{vol:0.4,type:"bandpass",f:1800,q:0.7,bus:bgmBus});tone(210,next,0.1,{type:"triangle",vol:0.18,to:150,bus:bgmBus})}

  if(kind==="over"){bgmMode="lose";SE.sad()}else{bgmMode="win";SE.fanfare()}
  showActions(kind==="over"
    ?`つまらない授業中、覚醒して宇宙人と戦う妄想をしたら、${Math.floor(gameT)}秒で校舎を壊された……\n撃退 ${kills} 体【${rank}】\n先生「${line}」`
    :`つまらない授業中、覚醒して校庭の宇宙人を ${kills} 体撃退する妄想をした【${rank}】\n先生「${line}」`);
}

/* ---------- 入力 ---------- */
stage.addEventListener("pointerdown",e=>{
  if(e.target.closest&&e.target.closest(".actions,.special,.skip"))return;
  initAudio();
  if(state==="idle"){startIntro();return}
  if(state==="battle"){e.preventDefault();fire(e.clientX,e.clientY)}
});
document.addEventListener("keydown",e=>{
  if((e.code==="Space"||e.code==="Enter")&&(e.target===stage||e.target===document.body)){e.preventDefault();initAudio();
    if(state==="idle")startIntro();else if(state==="intro"){enterBattle()}else if(state==="battle"){special()}else if(state==="end"){goIdle();startIntro()}}
});

/* ---------- 毎フレーム ---------- */
let last=performance.now();
function tick(now){
  let rdt=Math.min(0.05,(now-last)/1000)*(window.__hbSpeed||1);last=now;
  let dt=rdt;if(hitStop>0){hitStop-=rdt;dt=rdt*0.15}
  const ease=r=>1-Math.exp(-rdt*r);
  // --- オープニング
  if(active===classroom){
    cUfo.g.rotation.y+=rdt*1.5;cUfo.lights.forEach((l,i)=>l.visible=Math.floor(now/180+i)%2===0);
    if(state==="intro"&&gameIntroT()>3.0){cUfo.g.position.lerp(tmp.set(-13,3.6,6.5),ease(1.8))}
    zzz.position.y=1.9+Math.sin(now/400)*0.08;
    if(heroUp){hero.upper.rotation.x+=(0-hero.upper.rotation.x)*ease(6);hero.head.rotation.x+=(-0.05-hero.head.rotation.x)*ease(6);
      hero.arms.forEach((a,i)=>{a.rotation.x+=((powerUp?-0.2:-0.6)-a.rotation.x)*ease(6);a.rotation.z+=((powerUp?(i?0.5:-0.5):0)-a.rotation.z)*ease(4)})}
    if(powerUp){hero.aura.material.opacity+=(0.8-hero.aura.material.opacity)*ease(3);hero.aura.scale.setScalar(3.4+Math.sin(now/90)*0.3);
      hero.spikes.forEach(s=>{s.scale.y+=(1.8-s.scale.y)*ease(4);s.material.color.lerp(new THREE.Color(0xffe27a),ease(3))});hero.hair.children[0].material.color.lerp(new THREE.Color(0xffe27a),ease(3));
      hero.g.position.y+=(0.12-hero.g.position.y)*ease(2);
      if(Math.random()<0.5){const p=hero.g.position.clone().add(new THREE.Vector3((Math.random()-.5)*1.2,0.2+Math.random()*1.5,(Math.random()-.5)*1.2));const s=glowSprite(TEX.gold,0.25);s.position.copy(p);addFx(s,classroom,{life:0.8,vel:new THREE.Vector3(0,2.5,0)})}}
    camera.position.lerp(camK.pos,ease(powerUp?2.2:1.2));camLook.lerp(camK.look,ease(2.5));
  }
  // --- バトル
  if(active===field){
    ufo.g.rotation.y+=rdt*1.2;ufo.lights.forEach((l,i)=>l.visible=Math.floor(now/150+i)%2===0);
    if(state==="battle"||state==="countdown")ufo.g.position.x=Math.sin(now/1700)*9;
    fighter.aura.scale.setScalar(3.4+Math.sin(now/90)*0.25);
    if(Math.random()<0.4){const p=fighter.g.position.clone().add(new THREE.Vector3((Math.random()-.5)*1.1,0.2+Math.random()*1.6,(Math.random()-.5)*0.8));const s=glowSprite(TEX.gold,0.28);s.position.copy(p);addFx(s,field,{life:0.7,vel:new THREE.Vector3(0,2.6,0)})}
    if(castT>0){castT-=rdt;if(castT<=0){fighter.hand.visible=false}}
    fighter.arms[1].rotation.x+=((castT>0?-2.6:-0.2)-fighter.arms[1].rotation.x)*ease(castT>0?30:6);
    if(state==="battle"){
      gameT+=dt;const left=Math.max(0,60-gameT);timeEl.textContent=Math.ceil(left);
      if(left<=10&&!lastWarned){lastWarned=true;bgmMode="last";banner("ラスト10秒！","");SE.wave()}
      // 敵の出現
      spawnT-=dt;
      if(spawnT<=0){const k=gameT;spawnT=k<10?0.8:k<20?0.6:k<35?0.45:k<48?0.33:0.26;
        const n=(k<10?1:k<35?2:3)+(Math.random()<0.5?1:0);
        for(let i=0;i<n&&alive()<MAX_ALIVE;i++){
          const r=Math.random();const type=k>22&&r<0.13?"purple":k>6&&r<0.42?"pink":"green";
          const hw0=halfW(-50)-2;const x=Math.random()<0.5?Math.max(-hw0,Math.min(hw0,ufo.g.position.x+(Math.random()-.5)*10)):(Math.random()*2-1)*hw0;
          const a=makeAlien(type,x,-50-Math.random()*2);a.state="drop";a.drop=1;a.g.position.y=8+Math.random()*3}
        ufo.beam.material.opacity=0.32}
      for(const w of[20,32,48])if(!waves[w]&&gameT>=w){waves[w]=true;banner(w===20?"第二波！":w===32?"大群が来た！":"もう無理！？",w===48?"校庭が宇宙人であふれる":"");SE.wave();
        const n=w===20?14:w===32?22:30,rows=w===48?3:2,per=Math.ceil(n/rows);
        for(let i=0;i<n;i++){const row=Math.floor(i/per),col=i%per;const z=-46-row*2.5;const hw=halfW(z)-1.5;
          const x=-hw+col*(2*hw/Math.max(1,per-1));const r=Math.random();
          const a=makeAlien(w>=30&&r<0.1?"purple":r<0.35?"pink":"green",x+(Math.random()-.5)*0.8,z);a.state="drop";a.drop=1;a.g.position.y=6+Math.random()*5}}
      ufo.beam.material.opacity*=Math.pow(0.1,dt);
      if(comboT>0)comboT-=dt;
      if(gameT>=60)timeUp();
    }
    // エイリアン
    for(const a of[...aliens]){
      if(a.dead){a.dying-=dt;a.vel.y-=25*dt;a.g.position.addScaledVector(a.vel,dt);a.g.rotation.x+=a.spin*dt;a.g.rotation.z+=a.spin*0.6*dt;a.g.scale.multiplyScalar(Math.pow(0.25,dt));
        if(a.dying<=0)removeAlien(a);continue}
      if(a.state==="drop"){a.g.position.y-=dt*14;if(a.g.position.y<=0){a.g.position.y=0;a.state="walk"}continue}
      if(a.state==="rush"){a.phase+=dt*20;a.g.position.z+=dt*14;a.body.position.y=Math.abs(Math.sin(a.phase))*0.3;
        if(a.g.position.z>-1){const p=a.g.position.clone();p.y=2;burst(field,p,16,TEX.dust,2.6,7,1);popText(field,"ドカーン",p.clone().add(new THREE.Vector3(0,2,0)),"#ff4d5e",3.2,1);removeAlien(a)}continue}
      if(a.state==="cheer"){a.phase+=dt*11;a.body.position.y=Math.abs(Math.sin(a.phase))*0.55;a.body.rotation.z=Math.sin(a.phase*0.5)*0.2;continue}
      if(a.state==="lift"){a.drop+=dt;a.g.position.y+=dt*(4+a.drop*8);a.g.position.x+=(ufo.g.position.x-a.g.position.x)*dt*0.8;a.g.position.z+=(ufo.g.position.z-a.g.position.z)*dt*0.5;a.g.rotation.y+=dt*6;
        if(a.g.position.y>15)removeAlien(a);continue}
      if(a.state!=="walk"||state!=="battle")continue;
      a.phase+=dt*a.speed*2.2;
      a.g.position.z+=a.speed*dt;
      const prog=Math.min(1,Math.max(0,(a.g.position.z-a.startZ)/(LINE_Z-a.startZ)));
      const wantX=a.startX+(a.targetX-a.startX)*prog+Math.sin(a.phase*0.25)*a.sway*0.8;
      a.g.position.x+=(wantX-a.g.position.x)*Math.min(1,dt*3);
      const hw=halfW(a.g.position.z)-0.8;a.g.position.x=Math.max(-hw,Math.min(hw,a.g.position.x));
      a.body.position.y=Math.abs(Math.sin(a.phase))*0.18;a.body.rotation.z=Math.sin(a.phase)*0.12;
      a.body.children.forEach(c=>{if(c.userData.leg!==undefined)c.rotation.x=Math.sin(a.phase+(c.userData.leg>0?0:Math.PI))*0.6});
      if(a.g.position.z>=LINE_Z){breach(a);break}
    }
    // 魔法弾
    for(let i=bolts.length-1;i>=0;i--){const b=bolts[i];
      let tgt=b.target&&!b.target.dead&&aliens.includes(b.target)?tmp.copy(b.target.g.position).add(tmp2.set(0,1.1*b.target.g.scale.x,0)):b.point;
      const dir=tmp2.copy(tgt).sub(b.g.position);const dist=dir.length();const step=b.speed*rdt;
      b.g.lookAt(tgt);
      if(dist<=step+0.3){b.g.position.copy(tgt);
        const ring=glowSprite(TEX.ring,0.6);ring.position.copy(tgt);addFx(ring,field,{life:0.35,grow:4});
        const imp=tgt.clone().setY(0);const ring2=glowSprite(TEX.ring,1);ring2.position.copy(imp).setY(0.6);addFx(ring2,field,{life:0.35,grow:5});
        const hitList=aliens.filter(a=>!a.dead&&a.state==="walk"&&Math.hypot(a.g.position.x-imp.x,a.g.position.z-imp.z)<1.6+a.g.scale.x*0.45);
        if(b.target&&!b.target.dead&&aliens.includes(b.target)&&!hitList.includes(b.target))hitList.push(b.target);
        if(!hitList.length)burst(field,tgt,6,TEX.dust,1.2,4,0.5);
        for(const a of hitList)hitAlien(a,1);
        field.remove(b.g);bolts.splice(i,1);continue}
      b.g.position.addScaledVector(dir.normalize(),step);
      b.trail-=rdt;if(b.trail<=0){b.trail=0.012;const s=glowSprite(TEX.magic,0.9);s.position.copy(b.g.position);addFx(s,field,{life:0.25,grow:-0.6})}
    }
    // 黒板消しメテオ
    for(let i=erasers.length-1;i>=0;i--){const e=erasers[i];e.g.position.addScaledVector(e.v,rdt);e.g.rotation.y+=rdt*3;
      if(e.g.position.y<=0.7){SE.impact();shake=Math.max(shake,0.6);burst(field,e.target.clone().setY(1),12,TEX.dust,2.2,9,0.8);
        const ring=glowSprite(TEX.ring,1);ring.position.copy(e.target).setY(0.5);addFx(ring,field,{life:0.5,grow:14});
        for(const a of aliens)if(!a.dead&&a.state==="walk"&&Math.hypot(a.g.position.x-e.target.x,a.g.position.z-e.target.z)<6.2)hitAlien(a,99,true);
        field.remove(e.g);erasers.splice(i,1)}}
    // 終わりの演出
    if(ending){ending.t+=rdt;
      if(ending.fly){ufo.g.position.y+=rdt*(6+ending.t*6);ufo.g.position.z-=rdt*20}
      if(ending.kind==="over"&&ending.collapse){school.rotation.z=Math.min(0.06,ending.t*0.03);school.position.y=-Math.min(1.5,ending.t*0.6);if(Math.random()<0.4){const p=new THREE.Vector3((Math.random()-.5)*60,Math.random()*10,0);burst(field,p,3,TEX.dust,3,3,1.2)}}}
    // カメラ
    let gp,gl;
    if(ending&&ending.kind==="over"&&ending.view){gp=tmp.set(8.5,15.2,-12.5);gl=tmp2.set(-1.2,10.2,1.2)}
    else if(ending&&ending.kind==="over"){gp=tmp.copy(BCAM.pos);gl=tmp2.copy(BCAM.look)}
    else if(ending){gp=tmp.set(0,19.5,9.5);gl=tmp2.set(ufo.g.position.x*0.5,Math.min(ufo.g.position.y,30)*0.55,-40)}
    else{gp=tmp.copy(BCAM.pos);gl=tmp2.copy(BCAM.look)}
    camera.position.lerp(gp,ease(ending&&ending.view?1.4:ending?1.4:3));camLook.lerp(gl,ease(ending&&state!=="end"?1.6:3));
  }
  if(shake>0){shake-=rdt;camera.position.x+=(Math.random()-.5)*shake*0.5;camera.position.y+=(Math.random()-.5)*shake*0.5}
  camera.lookAt(camLook);
  for(let i=fx.length-1;i>=0;i--){const f=fx[i];f.t+=rdt;f.vel.y+=f.grav*rdt;f.s.position.addScaledVector(f.vel,rdt);
    if(f.grow){const k=Math.max(0.01,f.base+f.grow*(f.t/f.life));f.s.scale.set(k,k*(f.s.scale.y/f.s.scale.x||1),1)}
    f.s.material.opacity=f.op*Math.max(0,1-Math.max(0,f.t-f.life*0.55)/(f.life*0.45));
    if(f.t>=f.life){f.parent.remove(f.s);fx.splice(i,1)}}
  renderer.render(active,camera);
  requestAnimationFrame(tick);
}
function resize(){const r=stage.getBoundingClientRect();if(!r.width||!r.height)return;
  renderer.setSize(r.width,r.height,false);camera.aspect=r.width/r.height;camera.updateProjectionMatrix()}
new ResizeObserver(resize).observe(stage);resize();
goIdle();
window.__hb={cam(px,py,pz,lx,ly,lz,fx_,fz){BCAM.pos.set(px,py,pz);BCAM.look.set(lx,ly,lz);if(fx_!==undefined)fighter.g.position.set(fx_,12.45,fz)},get state(){return state},get kills(){return kills},get hp(){return hp},get aliens(){return aliens.length},fire,special,
  setGauge(v){gauge=v;updHud()},setT(v){gameT=v},setHp(v){hp=v;updHud()},alienScreen(){const r=stage.getBoundingClientRect();return aliens.filter(a=>!a.dead&&a.state==="walk").map(a=>{const p=a.g.position.clone();p.y+=1.2*a.g.scale.x;p.project(camera);return [r.left+(p.x+1)/2*r.width,r.top+(1-p.y)/2*r.height]})}};
requestAnimationFrame(tick);
})();
</script>
