<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ひらめき文庫</title>
<meta name="description" content="一日一冊、思いつきを小さなゲームにして棚に並べるひらめき文庫。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;700&family=Zen+Old+Mincho:wght@600;900&display=swap">
<style>
/* 本棚：games.json を読んで表紙を並べる。表紙をタップすると games/<id>/ のゲームへ */
:root{
  --paper:#eef0ea; --ink:#1f2430; --ink-soft:#5a6070; --card:#fbfbf7; --rule:#cfd2c8;
  --shelf:#3b2a20; --bulb:#ffcf33;
  --font-display:"Dela Gothic One","Zen Kaku Gothic New",system-ui,sans-serif;
  --font-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --font-mincho:"Zen Old Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --paper:#16181d; --ink:#e9e8e0; --ink-soft:#a3a6ae; --card:#f3f2ea; --rule:#33363f; --shelf:#2a1d15; color-scheme:dark}}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.7}
.wrap{max-width:1000px;margin:0 auto;padding-block:32px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:32px}
header{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.mark{width:60px;height:60px;border-radius:50%;background:var(--bulb);display:grid;place-items:center}
.mark svg{width:34px;height:34px}
h1{font-family:var(--font-display);font-weight:400;font-size:clamp(30px,7vw,52px);line-height:1.1;margin:0;letter-spacing:.04em}
.tag{margin:4px 0 0;color:var(--ink-soft);font-family:var(--font-mincho);font-weight:600}
.meta{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--ink-soft);border-top:1px solid var(--rule);padding-top:10px}
.meta b{color:var(--ink);font-variant-numeric:tabular-nums}
.shelf{background:var(--shelf);border-radius:6px;padding:16px 14px 14px}
.covers{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.cover{display:flex;flex-direction:column;gap:8px;color:#fff;text-decoration:none;
  border-radius:3px 6px 6px 3px;padding:10px 10px 12px;box-shadow:inset 6px 0 0 rgba(0,0,0,.18);transition:transform .15s ease}
.cover:hover{transform:translateY(-4px)}
.cover:focus-visible{outline:3px solid var(--bulb);outline-offset:3px}
.cover .top{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.12em;opacity:.9;padding-left:4px}
.art{background:var(--card);border-radius:2px;aspect-ratio:1/1;max-width:100%;display:grid;place-items:center}
.art img{width:82%;height:82%}
.cover h2{font-family:var(--font-mincho);font-weight:900;font-size:21px;line-height:1.25;margin:2px 0 0 4px;text-wrap:balance}
.cover p{margin:0 0 0 4px;font-size:12.5px;line-height:1.6;opacity:.92}
.chip{margin:auto 0 0 4px;align-self:flex-start;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--bulb);color:#1f2430}
.note{color:#e9e8e0;font-size:13px;margin:0}
footer{border-top:3px double var(--rule);padding-top:14px;font-size:12px;color:var(--ink-soft);
  display:grid;grid-template-columns:max-content 1fr;gap:2px 16px;max-width:340px}
footer .h{grid-column:1/-1;font-family:var(--font-mincho);font-weight:900;font-size:15px;color:var(--ink);margin-bottom:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 40 40"><path d="M20 4a12 12 0 0 0-7 21.8V30h14v-4.2A12 12 0 0 0 20 4z" fill="#1f2430"/><rect x="14" y="32" width="12" height="3" rx="1.5" fill="#1f2430"/></svg>
    </div>
    <div>
      <h1>ひらめき文庫</h1>
      <p class="tag">一日一冊、思いつきを小さなゲームにして棚に並べます。</p>
    </div>
    <div class="meta">
      <span>創刊 <b>2026.10.28</b></span>
      <span>既刊 <b id="count">―</b> 冊</span>
      <span>スマホ縦持ち推奨</span>
    </div>
  </header>

  <section class="shelf" aria-label="ゲーム一覧">
    <div class="covers" id="covers"><p class="note">本棚を読み込んでいます…</p></div>
  </section>

  <footer>
    <span class="h">奥付</span>
    <span>書名</span><span>ひらめき文庫</span>
    <span>創刊</span><span>二〇二六年十月二十八日</span>
    <span>発行</span><span>一日一冊（予定）</span>
  </footer>
</div>
<script>
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
fetch("games.json",{cache:"no-cache"}).then(r=>r.json()).then(list=>{
  const box=document.getElementById("covers");
  document.getElementById("count").textContent=list.length;
  box.innerHTML="";
  // 新しい巻が先頭に来るように逆順で並べる
  list.map((g,i)=>({...g,vol:i+1})).reverse().forEach(g=>{
    const a=document.createElement("a");
    a.className="cover";a.href=`games/${encodeURIComponent(g.id)}/`;
    a.style.background=g.color||"#4a5463";
    a.innerHTML=`<div class="top"><span>${esc(g.no||"")}</span><span>第${g.vol}巻</span></div>
      <div class="art"><img src="games/${encodeURIComponent(g.id)}/cover.svg" alt=""></div>
      <h2>${esc(g.title)}</h2><p>${esc(g.desc||"")}</p><span class="chip">あそぶ ▶</span>`;
    box.appendChild(a);
  });
}).catch(()=>{
  document.getElementById("covers").innerHTML='<p class="note">本棚を読み込めませんでした。games.json の書き方（カンマや " の抜け）を確認してください。</p>';
});
</script>
</body>
</html>
