<style>
/* 縦長(9:16)の3D画面：上に尿意ゲージ、中央に暗い家、下に十字キー */
:root{--bg:#07080d;--screen:#151826;--fg:#eef0ea;--line:#2c3046;--accent:#ffcf33;--glow:#7dffb0;--danger:#ff5a4a;
  --font-display:"Dela Gothic One","Zen Kaku Gothic New",system-ui,sans-serif;
  --font-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --font-mincho:"Zen Old Mincho","Hiragino Mincho ProN","Yu Mincho",serif;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);display:grid;place-items:center;
  padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.screen{height:min(100%,860px);aspect-ratio:9/16;max-width:100%;background:var(--screen);border-radius:18px;
  display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.6)}
@media (max-width:520px){body{padding:0}.screen{height:100%;width:100%;aspect-ratio:auto;border-radius:0;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}}
.bar{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.bar a{color:var(--fg);text-decoration:none;font-size:14px;padding:6px 12px;border-radius:99px;background:var(--line)}
.bar a:focus-visible,.mute:focus-visible{outline:2px solid var(--accent)}
.ttl{font-family:var(--font-mincho);font-weight:900;font-size:18px;margin:0}
.no{margin-left:auto;font-size:11px;opacity:.6;letter-spacing:.1em}
.mute{all:unset;cursor:pointer;font-size:12px;padding:5px 10px;border-radius:99px;border:1px solid var(--line);white-space:nowrap}

.stage{flex:1;min-height:0;position:relative;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:none;background:#05060b}
.stage:focus-visible{outline:3px solid var(--accent);outline-offset:-4px}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.flash{position:absolute;inset:0;background:#eef3ff;opacity:0;pointer-events:none}
.top{position:absolute;top:10px;left:12px;right:12px;display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;pointer-events:none;font-variant-numeric:tabular-nums}
.top .lab{font-size:12px;font-weight:700;letter-spacing:.1em;text-shadow:0 1px 2px #000}
.meter{height:12px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.meter i{display:block;height:100%;width:25%;background:var(--glow);border-radius:99px;transition:background .3s}
.top .time{font-family:var(--font-display);font-size:18px;text-shadow:0 1px 2px #000;min-width:4.2em;text-align:right}
.top .best{grid-column:1/-1;justify-self:end;font-size:11px;opacity:.75;text-shadow:0 1px 2px #000}
.dist{position:absolute;top:58px;left:0;right:0;text-align:center;font-family:var(--font-display);font-size:clamp(26px,8vw,40px);
  color:#fff;text-shadow:0 2px 0 #1f2430,0 0 12px rgba(0,0,0,.5);font-variant-numeric:tabular-nums;pointer-events:none}
.dist small{display:block;font-family:var(--font-body);font-weight:700;font-size:13px;letter-spacing:.12em;opacity:.85}
.dist em{display:block;font-style:normal;font-family:var(--font-mincho);font-weight:900;font-size:17px;color:var(--accent);margin-top:2px}
.dist.slam{animation:slam .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes slam{0%{transform:scale(1.9);opacity:.2}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.dist.slam{animation:none}}
.count{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-display);font-size:min(28vw,140px);color:#fff;
  text-shadow:0 4px 0 #1f2430,0 0 24px rgba(0,0,0,.4);pointer-events:none}
.hud{position:absolute;left:0;right:0;bottom:0;padding:40px 16px 14px;text-align:center;pointer-events:none;
  background:linear-gradient(transparent,rgba(5,6,11,.85))}
.msg{font-family:var(--font-display);font-size:clamp(20px,5.6vw,28px);letter-spacing:.04em;min-height:1.4em;text-shadow:0 2px 0 #000}
.rank{font-family:var(--font-mincho);font-weight:900;font-size:15px;color:var(--accent);min-height:1.5em;text-shadow:0 1px 0 #000}
.actions{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:10px;pointer-events:auto;animation:pop .35s ease-out}
.actions .row{display:flex;gap:10px;justify-content:center}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.btn{font:700 15px var(--font-body);border:0;border-radius:99px;padding:11px 20px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:focus-visible,.support:focus-visible,.pad button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn.x{background:#000;color:#fff;box-shadow:0 0 0 1px #555}
.btn.again{background:var(--accent);color:#1f2430}
.support{font-size:12px;color:var(--fg);opacity:.7;text-decoration:underline;text-underline-offset:3px}

.pad{flex:0 0 auto;display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(2,52px);gap:6px;justify-content:center;
  padding:12px 0 14px;border-top:1px solid var(--line);background:#11131d}
.pad button{border:0;border-radius:14px;background:#262a3d;color:var(--fg);font-size:22px;cursor:pointer;touch-action:none;
  box-shadow:0 3px 0 #0b0c12;-webkit-tap-highlight-color:transparent}
.pad button:active{transform:translateY(2px);box-shadow:0 1px 0 #0b0c12;background:#323750}
.pad .u{grid-column:2;grid-row:1}.pad .l{grid-column:1;grid-row:2}.pad .d{grid-column:2;grid-row:2}.pad .r{grid-column:3;grid-row:2}
.pad.off button{opacity:.35}
@media (prefers-reduced-motion:reduce){.actions{animation:none}}
</style>
</head>
<body>
<main class="screen">
  <div class="bar">
    <a href="./">← 棚へ</a>
    <h1 class="ttl">夜中のトイレ</h1>
    <span class="no">ひ-1-2</span>
    <button class="mute" id="mute" type="button" aria-pressed="false">音 ON</button>
  </div>
  <div class="stage" id="stage" tabindex="0" role="application" aria-label="夜中のトイレ。タップで開始、矢印キーやスワイプで移動">
    <div class="flash" id="flash"></div>
    <div class="top">
      <span class="lab">尿意</span>
      <div class="meter" role="meter" aria-label="尿意" aria-valuemin="0" aria-valuemax="100"><i id="bar"></i></div>
      <span class="time" id="time">0.00</span>
      <span class="best">ベスト <b id="best">―</b>／ジャンプ <b id="bestJ">―</b></span>
    </div>
    <div class="dist" id="dist"></div>
    <div class="count" id="count"></div>
    <div class="hud">
      <div class="msg" id="msg">タップで目を覚ます</div>
      <div class="rank" id="rank" aria-live="polite">雷が光る3秒で間取りを覚えろ</div>
      <div class="actions" id="actions" hidden>
        <div class="row">
          <a class="btn x" id="share" href="#" target="_blank" rel="noopener">𝕏 でシェア</a>
          <button class="btn again" id="again" type="button">もう一度</button>
        </div>
        <a class="support" href="https://ofuse.me/0825d42b" target="_blank" rel="noopener">☕ ひらめき文庫に差し入れ</a>
      </div>
    </div>
  </div>
  <div class="pad off" id="pad" aria-label="移動">
    <button class="u" type="button" data-d="u" aria-label="上">▲</button>
    <button class="l" type="button" data-d="l" aria-label="左">◀</button>
    <button class="d" type="button" data-d="d" aria-label="下">▼</button>
    <button class="r" type="button" data-d="r" aria-label="右">▶</button>
  </div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const $=id=>document.getElementById(id);
const stage=$("stage"),msg=$("msg"),rankEl=$("rank"),barEl=$("bar"),timeEl=$("time"),bestEl=$("best"),countEl=$("count"),
  flashEl=$("flash"),pad=$("pad"),actions=$("actions"),shareA=$("share"),againBtn=$("again"),muteBtn=$("mute");
if(!window.THREE){msg.textContent="3Dを読み込めませんでした";rankEl.textContent="通信状態を確認して再読み込みしてください";return}

/* ---------- 記録 ---------- */
let best=null,bestJ=null;
try{best=Number(localStorage.getItem("hb-toire-best"))||null;bestJ=Number(localStorage.getItem("hb-toire-jump"))||null}catch(e){}
const bestJEl=$("bestJ"),distEl=$("dist");
const showBest=()=>{bestEl.textContent=best?best.toFixed(2)+" 秒":"―";bestJEl.textContent=bestJ?bestJ.toFixed(1)+" m":"―"};
showBest();

/* ---------- 音（Web Audioで合成） ---------- */
const AC=window.AudioContext||window.webkitAudioContext;
let ac=null,master,bgmBus,sfxBus,noiseBuf,muted=false;
try{muted=localStorage.getItem("hb-mute")==="1"}catch(e){}
function showMute(){muteBtn.textContent=muted?"音 OFF":"音 ON";muteBtn.setAttribute("aria-pressed",String(muted))}
showMute();
function initAudio(){
  if(!AC)return;
  if(ac){if(ac.state==="suspended")ac.resume();return}
  ac=new AC();
  master=ac.createGain();master.gain.value=muted?0:0.85;master.connect(ac.destination);
  bgmBus=ac.createGain();bgmBus.gain.value=0.22;bgmBus.connect(master);
  sfxBus=ac.createGain();sfxBus.gain.value=0.9;sfxBus.connect(master);
  noiseBuf=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate);
  const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  startBgm();
}
muteBtn.addEventListener("pointerdown",e=>e.stopPropagation());
muteBtn.addEventListener("click",e=>{e.stopPropagation();muted=!muted;showMute();
  try{localStorage.setItem("hb-mute",muted?"1":"0")}catch(err){}
  initAudio();if(master)master.gain.setTargetAtTime(muted?0:0.85,ac.currentTime,0.02)});
function tone(f,t,dur,{type="sine",vol=0.3,to=null,bus=sfxBus,attack=0.005}={}){
  if(!ac)return;const o=ac.createOscillator(),g=ac.createGain();o.type=type;
  o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+attack);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(bus);o.start(t);o.stop(t+dur+0.02)}
function noise(t,dur,{vol=0.3,type="lowpass",f=1000,to=null,q=1,attack=0.005,bus=sfxBus}={}){
  if(!ac)return;const s=ac.createBufferSource(),fl=ac.createBiquadFilter(),g=ac.createGain();
  s.buffer=noiseBuf;s.loop=true;fl.type=type;fl.Q.value=q;fl.frequency.setValueAtTime(f,t);
  if(to)fl.frequency.exponentialRampToValueAtTime(to,t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+attack);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(fl);fl.connect(g);g.connect(bus);s.start(t);s.stop(t+dur+0.02)}
const T0=()=>ac?ac.currentTime:0;
const SE={
  crack(){const t=T0();noise(t,0.35,{vol:0.9,type:"highpass",f:2500,attack:0.001});noise(t+0.05,2.6,{vol:0.6,f:220,to:70,attack:0.08})},
  rumble(){const t=T0();noise(t,2.2,{vol:0.35,f:160,to:60,attack:0.4})},
  step(){const t=T0();noise(t,0.06,{vol:0.12,f:500,attack:0.002});tone(110,t,0.06,{vol:0.06})},
  bump(){const t=T0();tone(120,t,0.2,{vol:0.45,to:55});noise(t,0.1,{vol:0.25,f:600})},
  koyubi(){const t=T0();tone(140,t,0.18,{vol:0.5,to:60});noise(t,0.12,{vol:0.4,f:900});
    tone(700,t+0.12,0.55,{type:"sawtooth",vol:0.12,to:1500,attack:0.02});tone(1500,t+0.62,0.4,{type:"sawtooth",vol:0.08,to:600})},
  lego(){const t=T0();for(let i=0;i<3;i++)tone(2400+i*500,t+i*0.03,0.05,{type:"square",vol:0.12});tone(900,t+0.1,0.5,{type:"sawtooth",vol:0.1,to:1800,attack:0.02})},
  cat(){const t=T0();tone(600,t,0.18,{type:"sawtooth",vol:0.15,to:1100,attack:0.02});tone(1100,t+0.18,0.4,{type:"sawtooth",vol:0.13,to:500})},
  door(){const t=T0();tone(90,t,0.45,{type:"sawtooth",vol:0.08,to:140,attack:0.05})},
  flush(){const t=T0()+0.35;noise(t,1.8,{vol:0.45,type:"bandpass",f:500,to:2400,q:0.6,attack:0.08});noise(t+0.6,1.4,{vol:0.25,f:900,to:250,attack:0.2})},
  fail(){const t=T0();[392,370,349,330].forEach((f,i)=>tone(f,t+i*0.32,0.5,{type:"triangle",vol:0.25}));noise(t+1.3,1.4,{vol:0.2,f:700,attack:0.3})},
  result(){const t=T0();[523,659,784,1047].forEach((f,i)=>tone(f,t+i*0.09,0.25,{type:"square",vol:0.1}))},
  jump(dur){const t=T0();tone(300,t,Math.max(0.5,dur),{type:"triangle",vol:0.18,to:1800,attack:0.02});noise(t,0.25,{vol:0.3,type:"bandpass",f:900,to:2500})},
  crash(){const t=T0();noise(t,0.6,{vol:0.8,f:1800,to:200,attack:0.001});tone(80,t,0.4,{vol:0.5,to:40})},
  pass(){const t=T0();tone(1320,t,0.12,{type:"square",vol:0.06})},
  relief(kind){const t=T0();noise(t,1.5,{vol:0.16,f:900,to:300,attack:0.25});tone(kind==="teary"?620:480,t,1.4,{type:"sine",vol:0.13,to:kind==="teary"?400:260,attack:0.2});
    if(kind==="bliss")for(let i=0;i<10;i++)tone(1800+Math.random()*2600,t+0.2+i*0.09,0.16,{vol:0.05});},
  charge(){const t=T0();tone(140,t,0.4,{type:"square",vol:0.08,to:420,attack:0.02})},
  launch(){const t=T0();noise(t,0.35,{vol:0.5,type:"bandpass",f:400,to:3000,q:0.7});tone(200,t,0.25,{type:"square",vol:0.1,to:900})},
  wind(dur){const t=T0();noise(t,dur,{vol:0.22,type:"bandpass",f:500,to:2600,q:0.5,attack:0.2})},
  caw(){const t=T0();for(let i=0;i<2;i++){tone(780,t+i*0.22,0.16,{type:"sawtooth",vol:0.1,to:520});noise(t+i*0.22,0.12,{vol:0.08,type:"bandpass",f:1500})}},
  moff(){const t=T0();noise(t,0.4,{vol:0.25,f:700,to:250,attack:0.05})},
  plane(){const t=T0();tone(95,t,1.6,{type:"sawtooth",vol:0.06,to:80,attack:0.3});noise(t,1.6,{vol:0.1,f:300,attack:0.3})},
  bonk(){const t=T0();tone(150,t,0.25,{vol:0.5,to:60})},
  fanfare(){const t=T0();const m=[[523,0],[659,.12],[784,.24],[1047,.36],[988,.62],[1047,.74],[1319,.86]];
    m.forEach(([f,d])=>{tone(f,t+d,0.32,{type:"square",vol:0.09});tone(f/2,t+d,0.3,{type:"triangle",vol:0.12})});
    for(let i=0;i<8;i++)tone(2000+Math.random()*2500,t+0.9+i*0.05,0.12,{vol:0.05})},
  apex(){const t=T0();[784,988,1175,1568].forEach((f,i)=>tone(f,t+i*0.08,0.35,{type:"triangle",vol:0.14}))},
  yawn(){const t=T0();tone(330,t,0.7,{type:"triangle",vol:0.12,to:200,attack:0.15})}
};
/* BGM：しのび足のピチカート。尿意が上がるほどテンポが速くなる。虫の声つき */
let urgency=0,playing=false;
function startBgm(){
  const seq=[45,0,52,0,48,0,52,0, 45,0,52,0,53,0,52,0, 43,0,50,0,47,0,50,0, 44,0,52,0,47,0,0,0];
  const hz=m=>440*Math.pow(2,(m-69)/12);
  let i=0,next=ac.currentTime+0.15,cricket=ac.currentTime+0.5;
  setInterval(()=>{
    const bpm=playing?92+urgency*110:84;const step=60/bpm/2;
    while(next<ac.currentTime+0.3){
      const m=seq[i%32];
      if(m){tone(hz(m),next,0.16,{type:"triangle",vol:0.32,bus:bgmBus,attack:0.003});
        if(playing&&urgency>0.55&&i%4===0)tone(hz(m+24),next,0.08,{type:"square",vol:0.05,bus:bgmBus});}
      if(playing&&i%8===0)tone(55,next,0.12,{vol:0.25*(0.4+urgency),bus:bgmBus});
      i++;next+=step;}
    while(cricket<ac.currentTime+0.3){
      if(!playing||Math.random()<0.6){for(let k=0;k<3;k++)tone(4300,cricket+k*0.045,0.03,{vol:0.03,bus:bgmBus})}
      cricket+=0.5+Math.random()*1.2;}
  },100);
}

/* ---------- シェア・もう一度 ---------- */
let actionsTimer=null;
function showActions(text){
  const url=location.href.split("#")[0];
  shareA.href="https://twitter.com/intent/tweet?text="+encodeURIComponent(text+"\n#ひらめき文庫 #夜中のトイレ")+"&url="+encodeURIComponent(url);
  clearTimeout(actionsTimer);actionsTimer=setTimeout(()=>{actions.hidden=false},700);
}
function hideActions(){clearTimeout(actionsTimer);actions.hidden=true}
for(const b of actions.querySelectorAll("a,button"))b.addEventListener("pointerdown",e=>e.stopPropagation());
againBtn.addEventListener("click",e=>{e.stopPropagation();initAudio();start()});

/* ---------- 3D ---------- */
let renderer;
try{renderer=new THREE.WebGLRenderer({antialias:true})}catch(e){msg.textContent="この端末では3Dが動きませんでした";return}
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
stage.prepend(renderer.domElement);
const scene=new THREE.Scene();
const NIGHT=0x05060b;
scene.background=new THREE.Color(NIGHT);
const fog=new THREE.Fog(NIGHT,2.2,5.6);scene.fog=fog;
const camera=new THREE.PerspectiveCamera(50,9/16,0.1,200);
const hemi=new THREE.HemisphereLight(0x8a96ff,0x1a1a22,0.06);scene.add(hemi);
const moon=new THREE.DirectionalLight(0x7d8cff,0.12);moon.position.set(-4,10,6);scene.add(moon);
const eyeLight=new THREE.PointLight(0xffe2b8,1.0,4.8,2);scene.add(eyeLight);

const mat=(c,o)=>new THREE.MeshLambertMaterial(Object.assign({color:c},o||{}));
function box(w,h,d,c,x,y,z,parent){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));m.position.set(x,y,z);(parent||scene).add(m);return m}
function ball(r,c,x,y,z,parent){const m=new THREE.Mesh(new THREE.SphereGeometry(r,16,12),mat(c));m.position.set(x,y,z);(parent||scene).add(m);return m}
function textCanvas(text,{size=110,color="#fff",stroke="#1f2430",font="Dela Gothic One",w=640,h=200}={}){
  const c=document.createElement("canvas");c.width=w;c.height=h;const g=c.getContext("2d");
  g.font=`900 ${size}px "${font}", "Zen Kaku Gothic New", sans-serif`;g.textAlign="center";g.textBaseline="middle";
  if(stroke){g.lineWidth=size*0.16;g.strokeStyle=stroke;g.lineJoin="round";g.strokeText(text,w/2,h/2)}
  g.fillStyle=color;g.fillText(text,w/2,h/2);return c}
function sprite(text,scale,opts){opts=opts||{};
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(textCanvas(text,opts)),depthTest:false,transparent:true,fog:false}));
  s.scale.set(scale,scale*(opts.h||200)/(opts.w||640),1);s.renderOrder=10;return s}
const glowTex=(()=>{const c=document.createElement("canvas");c.width=c.height=128;const g=c.getContext("2d");

function genMaze(){

  const seen=Array.from({length:H},()=>Array(W).fill(false));
  const stack=[[Math.floor(Math.random()*W),Math.floor(Math.random()*H)]];seen[stack[0][1]][stack[0][0]]=true;
  while(stack.length){const [x,y]=stack[stack.length-1];
    const opts=Object.values(DIRS).filter(([dx,dy])=>inside(x+dx,y+dy)&&!seen[y+dy][x+dx]);
    if(!opts.length){stack.pop();continue}
    const [dx,dy,a,b]=opts[Math.floor(Math.random()*opts.length)];
    walls[y][x][a]=0;walls[y+dy][x+dx][b]=0;seen[y+dy][x+dx]=true;stack.push([x+dx,y+dy]);}
  // 少しだけ抜け道を作る
  for(let k=0,n=0;k<60&&n<6;k++){const x=Math.floor(Math.random()*W),y=Math.floor(Math.random()*H);
    const [dx,dy,a,b]=Object.values(DIRS)[Math.floor(Math.random()*4)];
    if(inside(x+dx,y+dy)&&walls[y][x][a]){walls[y][x][a]=0;walls[y+dy][x+dx][b]=0;n++}}
  // 家具（タンス）になる壁：内側の壁の一部
  tansu=new Set();
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    if(x<W-1&&walls[y][x].e&&Math.random()<0.38)tansu.add(`${x},${y},e`);
    if(y<H-1&&walls[y][x].s&&Math.random()<0.38)tansu.add(`${x},${y},s`);}
  start0=[Math.random()<.5?0:W-1,H-1];
  const {dist,prev}=bfs(start0);
  let far=start0,fd=-1;for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(dist[y][x]>fd&&y<H-2){fd=dist[y][x];far=[x,y]}
  goal=far;
  const path=[];let c=goal;while(c){path.unshift(c);c=prev[c[1]][c[0]]}
  // レゴと猫：必ず避けて通れる道が残る場所にだけ置く
  hazards={};

  const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
  const avoidLen=()=>{const {dist}=bfs(start0,hazards);return dist[goal[1]][goal[0]]};
  const onPath=shuffle(path.slice(2,-1).map(c=>[...c]));

      if(avoidLen()>0){placed=true;break}delete hazards[key(c)];}

function bfs(s,blocked){const dist=Array.from({length:H},()=>Array(W).fill(-1)),prev=Array.from({length:H},()=>Array(W).fill(null));

  sat.add(new THREE.Mesh(new THREE.BoxGeometry(0.8,0.8,0.8),pm(0xd8b46a)));
  for(const k of[-1,1]){const pnl=new THREE.Mesh(new THREE.BoxGeometry(2,0.05,0.9),pm(0x2f6fe0));pnl.position.x=k*1.45;sat.add(pnl)}
  star=null;
}

/* ---------- 状態 ---------- */
let squash=1,squashT=1,shake=0,sparkT=0,jump=null,state="idle",timers=[],cell=[0,0],moving=null,stun=0,meter=25,tPlay=0,koyubi=0,flashT=0,midFlash=0,heroFace=0,bumpAnim=0,bumpDir=[0,0];
const later=(fn,ms)=>timers.push(setTimeout(fn,ms));
const clearAll=()=>{timers.forEach(clearTimeout);timers=[]};
const fx=[];
function addFx(s,life,vy=0.6){scene.add(s);fx.push({s,life,t:0,vy});return s}
function clearFx(){for(const f of fx)scene.remove(f.s);fx.length=0}
function setLights(bright){
  if(bright){hemi.intensity=1.1;hemi.color.set(0xdfe6ff);moon.intensity=0.9;fog.near=200;fog.far=400;}
  else{hemi.intensity=0.06;hemi.color.set(0x8a96ff);moon.intensity=0.12;fog.near=2.2;fog.far=5.6;}}
function lightning(ms){flashT=ms/1000;flashEl.style.transition="none";flashEl.style.opacity="0.85";
  requestAnimationFrame(()=>{flashEl.style.transition="opacity .5s";flashEl.style.opacity="0"})}
function placeHero(){const p=cellPos(...cell);hero.position.copy(p);}
function updateBar(){
  const m=Math.max(0,Math.min(100,meter));barEl.style.width=m+"%";
  barEl.style.background=m<55?"var(--glow)":m<80?"var(--accent)":"var(--danger)";
  barEl.parentElement.setAttribute("aria-valuenow",String(Math.round(m)));}
function overheadCam(){
  const tan=Math.tan(THREE.MathUtils.degToRad(camera.fov/2));
  const hz=(H*TS)/2+1.2,hx=(W*TS)/2+1.2;
  const h=Math.max(hz/tan,hx/(tan*camera.aspect));
  return {pos:new THREE.Vector3(0,h,h*0.12),look:new THREE.Vector3(0,0,0)}}
let camMode="overhead";
const camLook=new THREE.Vector3();

function start(){
  clearAll();hideActions();clearFx();
  genMaze();buildHouse();cell=[...start0];placeHero();heroFace=Math.PI;hero.rotation.y=heroFace;
  jump=null;sky.visible=false;town.visible=false;skyObjs.visible=false;distEl.innerHTML="";distEl.classList.remove("slam");body.rotation.set(0,0,0);body.scale.set(1,1,1);squash=1;squashT=1;shake=0;setFace("normal");clearDebris();
  moving=null;stun=0;meter=25;tPlay=0;koyubi=0;midFlash=0;urgency=0;updateBar();timeEl.textContent="0.00";
  pad.classList.add("off");
  state="intro";camMode="hero";setLights(false);
  msg.textContent="……トイレ行きたい";rankEl.textContent="";SE.yawn();
  later(()=>{
    state="reveal";SE.crack();lightning(400);setLights(true);camMode="overhead";
    msg.textContent="雷で一瞬見えた！";rankEl.textContent="間取りを覚えろ";
    let n=3;countEl.textContent=n;
    const cd=()=>{n--;if(n>0){countEl.textContent=n;later(cd,1000)}else{
      countEl.textContent="";setLights(false);camMode="hero";SE.rumble();
      state="play";playing=true;pad.classList.remove("off");msg.textContent="";rankEl.textContent="";
      midFlash=8+Math.random()*7;}};
    later(cd,1000);
  },1300);
}

function tryMove(d){
  if(state!=="play"||moving||stun>0)return;
  const [dx,dy,a]=DIRS[d];const [x,y]=cell;
  heroFace=Math.atan2(dx,dy);
  if(walls[y][x][a]){
    bumpDir=[dx,dy];bumpAnim=0.25;
    if(isTansu(x,y,a)){koyubi++;stun=1.1;meter+=12;SE.koyubi();
      const s=addFx(sprite("小指ーッ！！",2.2,{size:94,color:"#ff5a4a",stroke:"#fff"}),1.2,0.5);s.position.copy(hero.position).add(new THREE.Vector3(0,2.2,0));}
    else{stun=0.35;meter+=3;SE.bump();
      const s=addFx(sprite("ゴンッ",1.4,{size:110,color:"#fff",stroke:"#1f2430"}),0.8,0.5);s.position.copy(hero.position).add(new THREE.Vector3(dx*0.8,1.6,dy*0.8));}
    updateBar();if(meter>=100)fail();return;
  }
  moving={from:cellPos(x,y),to:cellPos(x+dx,y+dy),t:0};cell=[x+dx,y+dy];SE.step();
}
function arrive(){
  const k=cell.join(",");
  if(cell[0]===goal[0]&&cell[1]===goal[1]){win();return}
  const hz=hazards[k];
  if(hz==="lego"){stun=0.9;meter+=9;SE.lego();
    const s=addFx(sprite("レゴ踏んだ！",2.0,{size:96,color:"#f2c531",stroke:"#1f2430"}),1.1,0.5);s.position.copy(hero.position).add(new THREE.Vector3(0,2.1,0));}
  if(hz==="cat"){stun=0.8;meter+=10;SE.cat();delete hazards[k];
    const s=addFx(sprite("ニャ゛ーッ！",2.0,{size:96,color:"#e2a35a",stroke:"#1f2430"}),1.1,0.5);s.position.copy(hero.position).add(new THREE.Vector3(0,2.1,0));
    if(catMesh){const c=catMesh;catMesh=null;let t=0;const run=()=>{t+=0.03;c.position.y=Math.sin(t*6)*0.6+0.3;c.position.x+=0.12;if(t<0.6)requestAnimationFrame(run);else houseGroup.remove(c)};run();}}
  updateBar();if(meter>=100)fail();
}
function endCommon(){state="end";playing=false;pad.classList.add("off");moving=null}
function win(){
  endCommon();SE.door();SE.flush();state="jump";
  const t=tPlay,margin=Math.max(0,100-meter);
  // 余裕（残りの尿意ゲージ）が多いほど高く跳ぶ
  const h=0.6+margin*margin/45;
  msg.textContent=`セーフ！ ${t.toFixed(2)} 秒`;rankEl.textContent="";
  setLights(true);hemi.intensity=0.5;heroFace=0;
  const kind=margin>=40?"bliss":margin>=26?"smile":margin>=12?"phew":"teary";
  const words={bliss:"至福……",smile:"ほっ……",phew:"ふぅ……",teary:"あ、あぶなかった……"}[kind];
  camMode="face";
  later(()=>{setFace(kind);SE.relief(kind);squashT=0.9;
    const s=addFx(sprite(words,kind==="teary"?2.2:1.7,{size:kind==="teary"?80:100,color:kind==="bliss"?"#ffe9a8":"#fff",stroke:"#1f2430"}),2.4,0.12);
    s.position.copy(hero.position).add(new THREE.Vector3(0.55,1.85,0.4));
    if(kind==="bliss")for(let i=0;i<12;i++)later(()=>spark(hero.position.clone().add(new THREE.Vector3((Math.random()-.5)*1.4,0.8+Math.random()*1.2,0.3+Math.random()*0.4)),0.35,1.2),i*110);
    rankEl.textContent="安心のあまり……";},700);
  later(()=>{squashT=1;squash=0.62;SE.charge();camMode="hero"},2900);
  later(()=>{
    const v=Math.sqrt(2*20*h);jump={v,h,top:h,t,crashed:false,passed:0,slow:false};
    squash=1.35;squashT=1;shake=0.35;sky.visible=true;town.visible=true;skyObjs.visible=true;buildSkyObjs(hero.position,v);
    camMode="jump";SE.launch();SE.wind(v/20+0.6);
  },3350);
}
const heightTitle=h=>h<1.9?"天井にゴツン":h<3.5?"天井を突き破った":h<8?"屋根を越えた":h<15?"電線を越えた":h<25?"カラスを追い越した":h<40?"雲を突き抜けた":h<60?"飛行機と並んだ":h<85?"月に手が届きそう":"宇宙へ行った";
function finishJump(){
  const {t,top}=jump;jump.done=true;state="end";
  const title=heightTitle(top);
  if(top<1.9){SE.bonk();const s=addFx(sprite("ゴツン",1.4,{size:110,color:"#fff",stroke:"#1f2430"}),1,0.3);s.position.copy(hero.position).add(new THREE.Vector3(0,1.9,0))}
  else{SE.fanfare();const s=addFx(sprite("スッキリ〜！",2.8,{size:100,color:"#7dffb0",stroke:"#1f2430"}),2.2,0.25);s.position.copy(hero.position).add(new THREE.Vector3(0,2.4,0));
    for(let i=0;i<14;i++){const a=i/14*Math.PI*2;spark(hero.position.clone().add(new THREE.Vector3(Math.cos(a)*1.4,1+Math.sin(a)*1.4,0.2)),0.7,1.0)}
    if(top>8)star={p:hero.position.clone().add(new THREE.Vector3(-12,7,-8)),v:new THREE.Vector3(16,-4.5,0),life:1.4};
    camMode="apex";}
  const rank=t<12?"夜目の達人":t<18?"間取りマスター":t<26?"寝ぼけた大人":"ギリギリセーフ";
  distEl.innerHTML=`${top.toFixed(1)} m<small>喜びジャンプ</small><em>${title}</em>`;
  distEl.classList.remove("slam");void distEl.offsetWidth;distEl.classList.add("slam");
  let upd=[];
  if(!best||t<best){best=t;upd.push("タイム");try{localStorage.setItem("hb-toire-best",best.toFixed(2))}catch(e){}}
  if(!bestJ||top>bestJ){bestJ=top;upd.push("ジャンプ");try{localStorage.setItem("hb-toire-jump",bestJ.toFixed(1))}catch(e){}}
  showBest();
  rankEl.textContent=`${rank}　小指 ${koyubi} 回`+(upd.length?`　${upd.join("・")}ベスト更新！`:"");
  showActions(`夜中のトイレ、真っ暗な家を ${t.toFixed(2)}秒 で突破！\n安心のあまり ${top.toFixed(1)}m 跳び上がり、${title}【${rank}】\n小指をぶつけた回数：${koyubi}回`);
}
function clearDebris(){for(const d of debris)scene.remove(d.m);debris.length=0}
function crashRoof(){
  SE.crash();const s=addFx(sprite("ドカーン！",2.6,{size:110,color:"#ffcf33",stroke:"#1f2430"}),1.2,1.5);
  s.position.copy(hero.position).add(new THREE.Vector3(0,0.8,0));
  for(let i=0;i<10;i++){const m=box(0.3,0.08,0.3,i%2?0x6b4a35:0x3a3f55,hero.position.x,hero.position.y,hero.position.z);
    debris.push({m,v:new THREE.Vector3((Math.random()-.5)*8,6+Math.random()*6,(Math.random()-.5)*8),w:Math.random()*10})}
}
function fail(){
  if(state!=="play")return;
  endCommon();meter=100;updateBar();SE.fail();
  msg.textContent="もれた……";rankEl.textContent=`明日は布団を干す日　小指 ${koyubi} 回`;
  scene.background.set(0x0b1630);
  showActions(`夜中のトイレ、間に合わなかった……\n小指をぶつけた回数：${koyubi}回【明日は布団を干す日】`);
}

/* ---------- 入力 ---------- */
stage.addEventListener("pointerdown",e=>{
  initAudio();
  if(state==="idle"){e.preventDefault();start();return}
  sw={x:e.clientX,y:e.clientY,id:e.pointerId};
});
let sw=null;
stage.addEventListener("pointerup",e=>{
  if(!sw||sw.id!==e.pointerId)return;const dx=e.clientX-sw.x,dy=e.clientY-sw.y;sw=null;
  if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;
  tryMove(Math.abs(dx)>Math.abs(dy)?(dx>0?"r":"l"):(dy>0?"d":"u"));
});
const KEYS={ArrowUp:"u",ArrowDown:"d",ArrowLeft:"l",ArrowRight:"r",KeyW:"u",KeyS:"d",KeyA:"l",KeyD:"r"};
document.addEventListener("keydown",e=>{
  if(KEYS[e.code]){e.preventDefault();initAudio();if(state==="idle")start();else tryMove(KEYS[e.code]);return}
  if((e.code==="Space"||e.code==="Enter")&&e.target===stage){e.preventDefault();initAudio();if(state==="idle"||state==="end")start()}
});
let hold=null;
for(const b of pad.querySelectorAll("button")){
  const d=b.dataset.d;
  b.addEventListener("pointerdown",e=>{e.preventDefault();initAudio();if(state==="idle"){start();return}
    tryMove(d);clearInterval(hold);hold=setInterval(()=>tryMove(d),120);});
  for(const ev of["pointerup","pointerleave","pointercancel"])b.addEventListener(ev,()=>clearInterval(hold));
}

/* ---------- 毎フレーム ---------- */
let last=performance.now();
const tmpV=new THREE.Vector3();
function tick(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  const ease=r=>1-Math.exp(-dt*r);
  if(state==="play"){
    tPlay+=dt;timeEl.textContent=tPlay.toFixed(2);
    meter+=dt*(2.0+tPlay*0.03);urgency=Math.min(1,Math.max(0,(meter-25)/75));updateBar();
    if(stun>0)stun-=dt;
    if(midFlash>0){midFlash-=dt;if(midFlash<=0){SE.crack();lightning(250);flashT=0.25}}
    if(meter>=100)fail();
  }
  if(jump&&!jump.done){
    // てっぺん直前はスローモーション
    const slow=jump.top>8&&jump.v<5?0.32:1;const jdt=dt*slow;
    jump.v-=20*jdt;hero.position.y+=jump.v*jdt;
    body.rotation.y+=jdt*(5+jump.h*0.12);
    if(!jump.crashed&&jump.top>=1.9&&hero.position.y>1.9){jump.crashed=true;crashRoof()}
    while(jump.passed<MARKS.length&&hero.position.y>=MARKS[jump.passed][0]){const h=MARKS[jump.passed][0];jump.passed++;SE.pass();
      if(h===8&&crow){crow.userData.fly=true;SE.caw();const s=addFx(sprite("カァ！",1.3,{size:110,color:"#fff",stroke:"#1f2430"}),1,0.5);s.position.copy(crow.position).add(new THREE.Vector3(0,0.8,0))}
      if(h===25){SE.moff();const s=addFx(sprite("モフッ",1.4,{size:110,color:"#fff",stroke:"#5a6070"}),1,0.4);s.position.copy(hero.position).add(new THREE.Vector3(1,0.5,1))}
      if(h===40)SE.plane();}
    sparkT-=dt;if(sparkT<=0){sparkT=0.035;spark(hero.position.clone().add(new THREE.Vector3((Math.random()-.5)*0.6,0.5+Math.random()*0.8,(Math.random()-.5)*0.6)),0.35+Math.random()*0.35,0.7)}
    distEl.innerHTML=`${Math.max(0,hero.position.y).toFixed(1)} m<small>喜びジャンプ</small>`;
    if(jump.v<=0){hero.position.y=jump.top;finishJump()}
  }
  if(jump&&jump.done)body.rotation.y+=(Math.round(body.rotation.y/(Math.PI*2))*Math.PI*2-body.rotation.y)*ease(5);
  // 体の伸び縮み
  squash+=(squashT-squash)*ease(jump&&!jump.done?3:squashT<1?1.2:8);
  body.scale.set(1/Math.sqrt(squash),squash,1/Math.sqrt(squash));
  // 空の名物の動き
  if(skyObjs.visible){
    if(crow&&crow.userData.fly){crow.position.x+=dt*6;crow.position.y+=dt*3;crow.rotation.z=Math.sin(now/60)*0.3}
    if(plane){plane.position.x+=dt*9;plane.userData.blink.visible=(now%800)<300}
    if(sat)sat.rotation.y+=dt*0.6;
    if(star){star.life-=dt;star.p.addScaledVector(star.v,dt);spark(star.p,0.9,0.5);if(star.life<=0)star=null}
  }
  for(const d of debris){d.v.y-=20*dt;d.m.position.addScaledVector(d.v,dt);d.m.rotation.x+=d.w*dt;d.m.rotation.z+=d.w*dt}
  if(moving){moving.t+=dt/0.17;const k=Math.min(1,moving.t);hero.position.lerpVectors(moving.from,moving.to,k);
    body.position.y=Math.sin(k*Math.PI)*0.08;if(k>=1){moving=null;body.position.y=0;if(state==="play")arrive()}}
  // 体の動き：ぶつかった反動、焦り（内股で震える）
  if(bumpAnim>0){bumpAnim-=dt;const k=Math.sin((0.25-bumpAnim)/0.25*Math.PI)*0.25;body.position.x=bumpDir[0]*k;body.position.z=bumpDir[1]*k}
  else{body.position.x*=0.8;body.position.z*=0.8}
  const shiver=state==="play"?urgency:0;
  body.rotation.z=Math.sin(now/40)*0.04*shiver+(stun>0.5?Math.sin(now/60)*0.12:0);
  legs[0].rotation.z=-0.18*shiver;legs[1].rotation.z=0.18*shiver;
  if(state==="play")setFace(urgency>0.6||stun>0.5?"strain":"normal");
  sweat.visible=shiver>0.6;sweat.position.y=1.42-((now/700)%1)*0.3;
  let dy=heroFace-hero.rotation.y;dy=Math.atan2(Math.sin(dy),Math.cos(dy));hero.rotation.y+=dy*ease(14);
  eyeLight.position.copy(hero.position).add(tmpV.set(0,1.8,0));
  if(glow)glow.material.opacity=0.55+Math.sin(now/500)*0.2;
  // 稲妻（ゲーム中の一瞬）
  if(flashT>0){flashT-=dt;if(state==="play"){setLights(flashT>0)}}
  // カメラ
  let goalPos,goalLook;
  if(camMode==="overhead"){const o=overheadCam();goalPos=o.pos;goalLook=o.look}
  else if(camMode==="face"){goalLook=tmpV.copy(hero.position).add(new THREE.Vector3(0,1.15,0));goalPos=hero.position.clone().add(new THREE.Vector3(0.5,1.45,2.4))}
  else if(camMode==="apex"){goalLook=tmpV.copy(hero.position).add(new THREE.Vector3(0,-1,0));goalPos=hero.position.clone().add(new THREE.Vector3(7,-3,15))}
  else if(camMode==="jump"){goalLook=tmpV.copy(hero.position).add(new THREE.Vector3(0,0.6,0));goalPos=hero.position.clone().add(new THREE.Vector3(2.5,1.2,10))}
  else{goalLook=tmpV.copy(hero.position).add(new THREE.Vector3(0,0.4,-0.6));goalPos=hero.position.clone().add(new THREE.Vector3(0,6.2,4.4))}
  camera.position.lerp(goalPos,ease(camMode==="overhead"?6:camMode==="jump"?9:camMode==="apex"?1.6:camMode==="face"?2.2:5));camLook.lerp(goalLook,ease(7));
  if(shake>0){shake-=dt;camera.position.x+=(Math.random()-.5)*shake*1.2;camera.position.y+=(Math.random()-.5)*shake*1.2}
  camera.lookAt(camLook);
  for(let i=fx.length-1;i>=0;i--){const f=fx[i];f.t+=dt;f.s.position.y+=f.vy*dt;
    f.s.material.opacity=Math.max(0,1-Math.max(0,f.t-f.life*0.6)/(f.life*0.4));if(f.t>=f.life){scene.remove(f.s);fx.splice(i,1)}}
  if(sky.visible){for(const m of markSprites)m.position.set(hero.position.x-2.6,m.userData.h,hero.position.z+1);
    const k=Math.min(1,hero.position.y/30);scene.background.setRGB(0.02+k*0.03,0.024+k*0.05,0.045+k*0.14)}
  else if(state!=="end")scene.background.set(NIGHT);
  renderer.render(scene,camera);
  requestAnimationFrame(tick);
}
function resize(){const r=stage.getBoundingClientRect();if(!r.width||!r.height)return;
  renderer.setSize(r.width,r.height,false);camera.aspect=r.width/r.height;camera.updateProjectionMatrix()}
new ResizeObserver(resize).observe(stage);resize();

// 最初の画面：寝室で眠っている様子を上から見せる
genMaze();buildHouse();cell=[...start0];placeHero();hero.rotation.y=Math.PI;heroFace=Math.PI;
{const o=overheadCam();camera.position.copy(o.pos);camLook.copy(o.look);camMode="hero";}
camera.lookAt(camLook);
requestAnimationFrame(tick);
})();
</script>
</body>
