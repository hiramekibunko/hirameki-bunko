<style>
/* 縦長(9:16)の3D画面：お化け屋敷の暗い通路。カーテンの陰から客を驚かす */
:root{--bg:#06050a;--screen:#140f1c;--fg:#f3eef8;--line:#2e2540;--accent:#ff9a2e;--ghost:#e9f2ff;--danger:#ff4d5e;--good:#7dffb0;

html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);display:grid;place-items:center;
  padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}

@media (max-width:520px){body{padding:0}.screen{height:100%;width:100%;aspect-ratio:auto;border-radius:0;

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const $=id=>document.getElementById(id);
const stage=$("stage"),msg=$("msg"),rankEl=$("rank"),topEl=$("top"),guestEl=$("guest"),dbEl=$("db"),comboEl=$("combo"),judgeEl=$("judge"),
  distEl=$("dist"),landEl=$("land"),flashEl=$("flash"),actions=$("actions"),shareA=$("share"),againBtn=$("again"),muteBtn=$("mute");
if(!window.THREE){msg.textContent="3Dを読み込めませんでした";rankEl.textContent="通信状態を確認して再読み込みしてください";return}

/* ---------- 記録 ---------- */
let bestD=null;
try{bestD=Number(localStorage.getItem("hb-obake-dist"))||null}catch(e){}
function fmtDist(m){if(m<1000)return Math.round(m)+" m";const km=m/1000;return km<100?km.toFixed(1)+" km":Math.round(km).toLocaleString("ja-JP")+" km"}

/* ---------- 音（Web Audioで合成） ---------- */
const AC=window.AudioContext||window.webkitAudioContext;
let ac=null,master,bgmBus,sfxBus,noiseBuf,muted=false;
try{muted=localStorage.getItem("hb-mute")==="1"}catch(e){}
function showMute(){muteBtn.textContent=muted?"音 OFF":"音 ON";muteBtn.setAttribute("aria-pressed",String(muted))}
showMute();
function initAudio(){
  if(!AC)return;
  if(ac){if(ac.state==="suspended")ac.resume();return}
  ac=new AC();
  const comp=ac.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=4;comp.connect(ac.destination);
  master=ac.createGain();master.gain.value=muted?0:0.95;master.connect(comp);
  bgmBus=ac.createGain();bgmBus.gain.value=0.6;bgmBus.connect(master);
  sfxBus=ac.createGain();sfxBus.gain.value=0.8;sfxBus.connect(master);
  noiseBuf=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate);
  const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  startBgm();
}
muteBtn.addEventListener("pointerdown",e=>e.stopPropagation());
muteBtn.addEventListener("click",e=>{e.stopPropagation();muted=!muted;showMute();
  try{localStorage.setItem("hb-mute",muted?"1":"0")}catch(err){}
  initAudio();if(master)master.gain.setTargetAtTime(muted?0:0.95,ac.currentTime,0.02)});
function tone(f,t,dur,{type="sine",vol=0.3,to=null,bus=sfxBus,attack=0.005,lp=null,vib=0}={}){
  if(!ac)return;const o=ac.createOscillator(),g=ac.createGain();o.type=type;
  o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+dur);
  if(vib){const l=ac.createOscillator(),lg=ac.createGain();l.frequency.value=5.5;lg.gain.value=vib;l.connect(lg);lg.connect(o.frequency);l.start(t);l.stop(t+dur+0.05)}
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+attack);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  let n=o;if(lp){const fl=ac.createBiquadFilter();fl.type="lowpass";fl.frequency.value=lp;o.connect(fl);n=fl}
  n.connect(g);g.connect(bus);o.start(t);o.stop(t+dur+0.02)}
function noise(t,dur,{vol=0.3,type="lowpass",f=1000,to=null,q=1,attack=0.005,bus=sfxBus}={}){
  if(!ac)return;const s=ac.createBufferSource(),fl=ac.createBiquadFilter(),g=ac.createGain();
  s.buffer=noiseBuf;s.loop=true;fl.type=type;fl.Q.value=q;fl.frequency.setValueAtTime(f,t);
  if(to)fl.frequency.exponentialRampToValueAtTime(to,t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+attack);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(fl);fl.connect(g);g.connect(bus);s.start(t);s.stop(t+dur+0.02)}
const T0=()=>ac?ac.currentTime:0;
const SE={
  step(v){const t=T0();noise(t,0.07,{vol:0.05+v*0.12,f:380,attack:0.003});tone(85,t,0.07,{vol:0.03+v*0.06})},
  pop(){const t=T0();noise(t,0.18,{vol:0.6,type:"bandpass",f:600,to:2600,q:0.8,attack:0.002});tone(160,t,0.18,{type:"square",vol:0.18,to:60,lp:1200})},
  slap(){const t=T0();noise(t,0.12,{vol:0.45,f:900,attack:0.001});tone(220,t,0.1,{type:"triangle",vol:0.2,to:110})},
  scream(level,pitch){const t=T0();const f=(pitch||900)*(0.9+Math.random()*0.2),dur=0.5+level*0.9;
    tone(f,t,dur,{type:"sawtooth",vol:0.06+level*0.14,to:f*(1.25+level*0.35),attack:0.02,lp:3200,vib:30+level*40});
    tone(f*1.5,t,dur*0.9,{type:"sawtooth",vol:0.03+level*0.06,to:f*2,attack:0.02,lp:4200,vib:40});
    noise(t,dur,{vol:0.08+level*0.2,type:"bandpass",f:f*2.2,q:2,attack:0.02})},
  laugh(){const t=T0();for(let i=0;i<5;i++)tone(320-i*12,t+i*0.13,0.1,{type:"triangle",vol:0.14,to:260})},
  wa(){const t=T0();tone(260,t,0.25,{type:"square",vol:0.2,to:520,lp:1600});noise(t,0.2,{vol:0.3,f:1200})},
  faint(){const t=T0();tone(600,t,0.9,{type:"sine",vol:0.15,to:120,attack:0.02,vib:20})},
  meh(){const t=T0();tone(200,t,0.35,{type:"triangle",vol:0.14,to:150})},
  perfect(){const t=T0();[880,1175,1568].forEach((f,i)=>tone(f,t+0.05+i*0.06,0.3,{type:"square",vol:0.07,lp:5000}))},
  denture(){const t=T0();for(let i=0;i<4;i++)tone(2600+i*300,t+0.15+i*0.05,0.04,{type:"square",vol:0.07})},
  door(){const t=T0();tone(140,t,0.6,{type:"sawtooth",vol:0.06,to:90,lp:700,attack:0.05})},
  bell(){const t=T0();[1047,784].forEach((f,i)=>tone(f,t+i*0.35,0.8,{vol:0.18}))},
  whoosh(){const t=T0();noise(t,0.8,{vol:0.4,type:"bandpass",f:300,to:3500,q:0.7})},
  pass(i){const t=T0();const f=[523,587,659,784,880,988,1047,1175,1319,1568,1760,2093][Math.min(i,11)];tone(f,t,0.25,{type:"triangle",vol:0.18})},
  fanfare(){const t=T0();[[523,0],[659,.12],[784,.24],[1047,.36],[988,.62],[1047,.74],[1319,.86]].forEach(([f,d])=>{tone(f,t+d,0.34,{type:"square",vol:0.1,lp:3500});tone(f/2,t+d,0.32,{type:"triangle",vol:0.14})})}
};
/* BGM：不気味なオルゴールと低音。客が近いほど心臓の音が速くなる */
let bgmMode="idle",near=0;
function startBgm(){
  const hz=m=>440*Math.pow(2,(m-69)/12);
  let next=ac.currentTime+0.1,step=0,lastMode="",beat=ac.currentTime+0.5;
  const mel=[69,72,76,75,72,69,68,71, 69,72,76,79,77,76,75,72, 69,72,76,75,72,69,68,64, 65,68,71,75,74,71,68,0];
  const bass=[45,45,41,41,44,44,40,40];
  setInterval(()=>{
    if(bgmMode!==lastMode){lastMode=bgmMode;step=0;next=Math.max(next,ac.currentTime+0.05)}
    while(next<ac.currentTime+0.3){
      let dur;
      if(bgmMode==="play"||bgmMode==="idle"){dur=60/(bgmMode==="play"?96:80)/2;
        const m=mel[step%32];if(m)tone(hz(m+12),next,0.9,{type:"sine",vol:0.07,bus:bgmBus,vib:4});
        if(m&&step%2===0)tone(hz(m+24),next,0.4,{type:"triangle",vol:0.025,bus:bgmBus});
        if(step%4===0)tone(hz(bass[(step/4)%8]),next,dur*3.8,{type:"triangle",vol:0.24,bus:bgmBus,attack:0.05});
        if(step%16===0)tone(hz(45-12),next,dur*15,{type:"sawtooth",vol:0.05,bus:bgmBus,lp:300,attack:0.6});
        if(bgmMode==="play"&&step%8===6)noise(next,0.4,{vol:0.04,type:"bandpass",f:2000+Math.random()*2000,q:4,attack:0.1,bus:bgmBus});
      }else if(bgmMode==="result"){dur=60/120/2;
        if(step%8===0)[[57,60,64],[53,57,60],[55,59,62],[57,60,64]][(step/8)%4].forEach(m=>tone(hz(m),next,dur*7,{type:"triangle",vol:0.08,bus:bgmBus,attack:0.05}));
        if(step%2===0)tone(hz([69,72,76,81][(step/2)%4]),next,dur*0.9,{type:"square",vol:0.045,bus:bgmBus,lp:3000});
      }else{dur=0.25}
      step++;next+=dur;}
    // 心臓の音
    if(bgmMode==="play"&&near>0.05){const iv=Math.max(0.32,1.1-near*0.8);
      while(beat<ac.currentTime+0.3){tone(55,beat,0.12,{vol:0.25+near*0.35,to:40,bus:bgmBus});tone(52,beat+0.16,0.12,{vol:0.18+near*0.3,to:38,bus:bgmBus});beat+=iv}}
    else beat=Math.max(beat,ac.currentTime+0.2);
  },100);
}

/* ---------- シェア・もう一度 ---------- */
let actionsTimer=null;
function showActions(text){
  const url=location.href.split("#")[0];
  shareA.href="https://twitter.com/intent/tweet?text="+encodeURIComponent(text+"\n#ひらめき文庫 #学園祭のおばけ役")+"&url="+encodeURIComponent(url);
  clearTimeout(actionsTimer);actionsTimer=setTimeout(()=>{actions.hidden=false},700);
}
function hideActions(){clearTimeout(actionsTimer);actions.hidden=true}
for(const b of actions.querySelectorAll("a,button"))b.addEventListener("pointerdown",e=>e.stopPropagation());
againBtn.addEventListener("click",e=>{e.stopPropagation();initAudio();reset();start()});

/* ---------- 3Dの共通部品 ---------- */
let renderer;
try{renderer=new THREE.WebGLRenderer({antialias:true})}catch(e){msg.textContent="この端末では3Dが動きませんでした";return}
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
stage.prepend(renderer.domElement);
const camera=new THREE.PerspectiveCamera(55,9/16,0.01,3000);
const mat=(c,o)=>new THREE.MeshLambertMaterial(Object.assign({color:c},o||{}));
const basic=(c,o)=>new THREE.MeshBasicMaterial(Object.assign({color:c},o||{}));
function box(w,h,d,c,x,y,z,parent,shadow){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),typeof c==="number"?mat(c):c);m.position.set(x,y,z);
  if(shadow!==false){m.castShadow=true;m.receiveShadow=true}parent.add(m);return m}
function ball(r,c,x,y,z,parent){const m=new THREE.Mesh(new THREE.SphereGeometry(r,18,14),typeof c==="number"?mat(c):c);m.position.set(x,y,z);m.castShadow=true;parent.add(m);return m}
function canvasTex(w,h,draw){const c=document.createElement("canvas");c.width=w;c.height=h;draw(c.getContext("2d"),w,h);const t=new THREE.CanvasTexture(c);t.userData={c};return t}
function textCanvas(text,{size=110,color="#fff",stroke="#1f1030",font="Dela Gothic One",h=200}={}){
  const c=document.createElement("canvas");let g=c.getContext("2d");const F=`900 ${size}px "${font}", "Zen Kaku Gothic New", sans-serif`;
  g.font=F;const w=Math.max(320,Math.ceil(g.measureText(text).width+size*0.7));
  c.width=w;c.height=h;g=c.getContext("2d");g.font=F;g.textAlign="center";g.textBaseline="middle";
  if(stroke){g.lineWidth=size*0.16;g.strokeStyle=stroke;g.lineJoin="round";g.strokeText(text,w/2,h/2)}
  g.fillStyle=color;g.fillText(text,w/2,h/2);return c}
function sprite(text,scale,opts){opts=opts||{};const c=textCanvas(text,opts);

function scare(){
  if(state!=="play"||!cur||cur.tapped||cur.state==="gone")return;
  cur.tapped=true;
  const sp=cur.T.speed,dt=(0-cur.z)/sp; // 正：早い　負：遅い
  const w=cur.T.win;
  let grade;
  if(cur.z<-6){grade="early"}
  else if(dt>0.34*w)grade="early";
  else if(dt<-0.34*w)grade="late";
  else{const a=Math.abs(dt);grade=a<0.08*w?"perfect":a<0.18*w?"great":"good"}
  if(cur.state==="pause"&&grade!=="early")grade="early";
  ghostOut();
  resolve(grade,dt);
}

    popText(house,"バレバレ〜",new THREE.Vector3(-0.3,2.3,g.z),"#ffe08a",0.8,1.6);
    later(()=>{ghostState="sad";popText(house,"しゅん……",ghost.position.clone().add(new THREE.Vector3(0,2.3,0)),"#aab",0.8,1.4)},500);
    later(()=>{if(g.state==="laugh"){g.state="walk";g.speed=g.T.speed}},1300)}
  else if(grade==="late"){g.state="turn";combo=0;label="逆に驚かされた";sub="遅すぎ！";
    g.members.forEach(m=>{setFace(m,"k")});
    later(()=>{SE.wa();g.members.forEach(m=>{m.arms.forEach(a=>a.rotation.x=-2.6)});popText(house,"わっ！",new THREE.Vector3(-0.2,2.3,g.z),"#fff",0.9,1.2);
      ghostState="faint";ghostT=0;SE.faint();gDizzy.visible=true;gEyes.visible=false;gMouth.visible=false},350);
    later(()=>{g.state="walk";g.members.forEach(m=>{setFace(m,"l");m.arms.forEach(a=>a.rotation.x=0)})},1500)}
  else{
    const tough=g.T.tough&&grade==="good";
    const base={perfect:120,great:100,good:80}[grade];
    if(grade==="perfect"){combo++;perfects++;bestCombo=Math.max(bestCombo,combo);SE.perfect()}else combo=0;
    db=tough?45:base+(grade==="perfect"?Math.min(30,(combo-1)*6):0)+g.T.n*(grade==="good"?0:4);
    label={perfect:"PERFECT!",great:"GREAT",good:"GOOD"}[grade];
    sub=tough?"「……べつに、こわくねぇし」":grade==="perfect"&&combo>=2?`${combo}連続！ ${db}dB`:`${db}dB`;
    g.state=tough?"tough":"scared";g.scareT=0;
    const lvl=tough?0.2:{perfect:1,great:0.7,good:0.45}[grade];g.lvl=lvl;
    shake=Math.max(shake,0.25+lvl*0.6);if(grade==="perfect")flash(0.35,0.4);
    later(()=>{SE.slap()},60);
    g.members.forEach((m,i)=>{setFace(m,tough?"k":"s");if(!tough){m.spikes.forEach(s=>s.visible=true);m.hair.children.forEach(c=>{if(!m.spikes.includes(c))c.visible=lvl<0.9})}
      later(()=>SE.scream(tough?0.1:lvl,g.T.pitch*(1+i*0.15)),80+i*90)});
    const word=tough?"……":grade==="perfect"?"ぎゃあああああ！！":grade==="great"?"きゃああ！":"ひっ！";
    popText(house,word,new THREE.Vector3(-0.3,2.35,g.z-0.3),tough?"#fff":"#ff6b6b",tough?0.7:0.6+lvl*0.6,1.6,new THREE.Vector3(0,0.6,0));
    if(g.T.denture&&!tough){later(()=>{SE.denture();const d=new THREE.Group();const t1=box(0.14,0.04,0.08,0xffffff,0,0,0,d,false);const t2=box(0.14,0.03,0.08,0xff9a9a,0,-0.03,0,d,false);
      d.position.copy(g.members[0].g.position).add(new THREE.Vector3(0,1.75*g.members[0].P.h,0.25));addFx(d,house,{life:1.4,vel:new THREE.Vector3(0.8,3.2,1.6),grav:-9,spin:9});
      popText(house,"入れ歯が！",d.position.clone().add(new THREE.Vector3(0.4,0.6,0)),"#fff",0.7,1.3)},200)}
  }
  total+=db;results.push({type:g.type,grade,db});updHud();
  judge(label,sub);
  if(grade!=="early")msg.textContent=label;
  later(()=>{if(g.state==="scared")g.state="flee"},grade==="perfect"?900:700);
}
function guestDone(g){
  if(g!==cur)return;
  if(!g.tapped){g.tapped=true;combo=0;results.push({type:g.type,grade:"miss",db:0});judge("スルー","気づかれずに通過");SE.meh();updHud()}
  g.state="gone";removeGuest(g);cur=null;near=0;gi++;
  ghostState="back";
  later(nextGuest,700);
}

/* ---------- 悲鳴の旅 ---------- */
const LANDS=[[3,"廊下に響いた"],[30,"校舎中に響いた"],[200,"校庭の向こうまで"],[1000,"商店街が振り向いた"],[8000,"となり町まで届いた"],[60000,"県境を越えた"],
  [400000,"富士山を越えた"],[3000000,"海を渡った"],[20000000,"地球の裏側まで"],[100000000,"宇宙に響いた"],[384000000,"月まで届いた"]];
const MAXD=3.844e8;
function distFor(db){const k=Math.max(0,Math.min(1,db/1250));return Math.pow(10,Math.pow(k,1.45)*Math.log10(MAXD))}
function landTitle(d){let t="教室の外に漏れた";for(const [m,l] of LANDS)if(d>=m)t=l;return t}
// 外の景色（夜の学校と町）

outside.add(new THREE.HemisphereLight(0x7a74c8,0x1a1426,0.55));
const moonLight=new THREE.DirectionalLight(0xbfc8ff,0.45);moonLight.position.set(-60,120,40);outside.add(moonLight);
(function(){
  const gr=new THREE.Mesh(new THREE.PlaneGeometry(1600,1600),mat(0x1f2a1c));gr.rotation.x=-Math.PI/2;outside.add(gr);
  const yard=new THREE.Mesh(new THREE.PlaneGeometry(60,40),mat(0x6a5a40));yard.rotation.x=-Math.PI/2;yard.position.set(0,0.02,-30);outside.add(yard);
  box(64,11,12,0xd8d2c4,0,5.5,0,outside,false);
  for(let fl_=0;fl_<3;fl_++)for(let x=-30;x<=30;x+=3.2){const lit=(fl_===1&&Math.abs(x-6.4)<2)||Math.random()<0.15;const w=new THREE.Mesh(new THREE.PlaneGeometry(2.2,1.5),lit?basic(fl_===1&&Math.abs(x-6.4)<2?0xff8a2a:0xffd27a):mat(0x1a2030));
    w.position.set(x,2+fl_*3.4,-6.02);w.rotation.y=Math.PI;outside.add(w)}
  const roofGeo=new THREE.ConeGeometry(1,1,4);roofGeo.rotateY(Math.PI/4);roofGeo.translate(0,0.5,0);
  for(let gx=-300;gx<=300;gx+=14)for(let gz=-300;gz<=300;gz+=14){

    box(w,h,d,[0xb8b0a0,0xa89888,0x9aa2aa,0xc6bcab][Math.floor(Math.random()*4)],x,h/2,z,outside,false);
    if(h<10){const rf=new THREE.Mesh(roofGeo,mat([0x4a2a24,0x2f3a4a,0x3a3a50][Math.floor(Math.random()*3)]));rf.scale.set(w*0.72+0.3,2+Math.random(),d*0.72+0.3);rf.position.set(x,h,z);outside.add(rf)}
    if(Math.random()<0.5){const lw=new THREE.Mesh(new THREE.PlaneGeometry(1.4,1),basic(0xffd27a));lw.position.set(x,Math.min(h-1,2.2),z+d/2+0.05);outside.add(lw)}}
  const n=700,p=new Float32Array(n*3);for(let i=0;i<n;i++){const v=new THREE.Vector3(Math.random()-.5,Math.random()*0.7+0.08,Math.random()-.5).normalize().multiplyScalar(1400);p.set([v.x,v.y,v.z],i*3)}
  const sg=new THREE.BufferGeometry();sg.setAttribute("position",new THREE.BufferAttribute(p,3));outside.add(new THREE.Points(sg,new THREE.PointsMaterial({color:0xffffff,size:1.6,sizeAttenuation:false,fog:false})));
  const mn=new THREE.Mesh(new THREE.SphereGeometry(40,24,16),basic(0xfff3c4,{fog:false}));mn.position.set(-500,420,-900);outside.add(mn);
})();
const wave=new THREE.Mesh(new THREE.RingGeometry(0.92,1,64),new THREE.MeshBasicMaterial({color:0xff9a3a,transparent:true,opacity:0.9,side:THREE.DoubleSide,depthWrite:false,fog:false}));
wave.rotation.x=-Math.PI/2;wave.position.set(6.4,0.5,-8);outside.add(wave);
const wave2=wave.clone();wave2.material=wave.material.clone();outside.add(wave2);
// 宇宙
const space=new THREE.Scene();space.background=new THREE.Color(0x02030a);
space.add(new THREE.AmbientLight(0xffffff,0.3));const sunL=new THREE.DirectionalLight(0xffffff,1.1);sunL.position.set(30,20,40);space.add(sunL);
const earthTex=canvasTex(1024,512,(g,w,h)=>{g.fillStyle="#1f5fb8";g.fillRect(0,0,w,h);g.fillStyle="#3f9a4a";
  for(let i=0;i<26;i++){g.beginPath();g.ellipse(Math.random()*w,h*0.15+Math.random()*h*0.7,30+Math.random()*90,20+Math.random()*50,Math.random(),0,7);g.fill()}
  g.fillStyle="#e8f0f8";g.fillRect(0,0,w,26);g.fillRect(0,h-26,w,26);
  // 学校のある場所（P0）に弓なりの島
  g.fillStyle="#4fae58";const cx=0.279*w,cy=0.315*h;
  for(let i=0;i<9;i++){const t=i/8;g.beginPath();g.ellipse(cx-50+t*95,cy+40-t*80+Math.sin(t*3)*14,26-Math.abs(t-0.5)*16,16,-0.7,0,7);g.fill()}
  g.fillStyle="#3a8a44";g.beginPath();g.ellipse(cx-120,cy-10,70,90,0,0,7);g.fill()});
const earth=new THREE.Mesh(new THREE.SphereGeometry(10,48,32),new THREE.MeshLambertMaterial({map:earthTex}));space.add(earth);
const P0=new THREE.Vector3(0.15,0.55,0.82).normalize();
{const sc=glowSprite(TEX.orange,0.5);sc.position.copy(P0).multiplyScalar(10.08);space.add(sc)}
const sRing=new THREE.Mesh(new THREE.TorusGeometry(1,0.05,8,96),new THREE.MeshBasicMaterial({color:0xff9a3a}));space.add(sRing);
const shell=new THREE.Mesh(new THREE.SphereGeometry(1,32,20),new THREE.MeshBasicMaterial({color:0xff9a3a,transparent:true,opacity:0.18,depthWrite:false}));shell.visible=false;space.add(shell);
const moonS=new THREE.Mesh(new THREE.SphereGeometry(2.7,32,20),mat(0xd9d6cc));moonS.position.set(-40,26,-50);space.add(moonS);
{const n=1500,p=new Float32Array(n*3);for(let i=0;i<n;i++){const v=new THREE.Vector3(Math.random()-.5,Math.random()-.5,Math.random()-.5).normalize().multiplyScalar(1500+Math.random()*500);p.set([v.x,v.y,v.z],i*3)}
  const g=new THREE.BufferGeometry();g.setAttribute("position",new THREE.BufferAttribute(p,3));space.add(new THREE.Points(g,new THREE.PointsMaterial({color:0xffffff,size:1.4,sizeAttenuation:false})))}

function finishAll(){
  state="travelIntro";bgmMode="none";near=0;
  const d=distFor(total);
  msg.textContent="閉店！";rankEl.textContent="今日の悲鳴は、どこまで届いた？";
  judge("閉店","悲鳴の合計 "+total+"dB");
  later(()=>{flash(1,0.8);active=outside;clearFx();SE.whoosh();
    camera.position.set(8,4,-24);camLook.set(6.4,5,-6);
    travel={u:0,dur:2.2+0.55*Math.log10(Math.max(d,10)),d,passed:0,last:0,space:false};state="travel";bgmMode="none"},1600);
}
function endTravel(){
  state="end";const d=travel.d;const title=landTitle(d);
  SE.fanfare();bgmMode="result";
  distEl.innerHTML=`${fmtDist(d)}<small>悲鳴が届いた距離</small><em>${title}</em>`;
  distEl.classList.remove("slam");void distEl.offsetWidth;distEl.classList.add("slam");
  const rank=total<450?"見習いおばけ":total<750?"人気のおばけ役":total<950?"学園祭の伝説":total<1150?"本物かもしれない":"本物だった";
  let upd=false;if(d>1&&(!bestD||d>bestD)){bestD=d;upd=true;try{localStorage.setItem("hb-obake-dist",String(Math.round(d)))}catch(e){}}
  msg.textContent=`悲鳴の合計 ${total}dB　PERFECT ${perfects}回`;
  rankEl.textContent=`【${rank}】`+(upd?"　自己ベスト更新！":bestD?`　ベスト ${fmtDist(bestD)}`:"");
  const sen=results[results.length-1];
  const senLine=sen&&sen.grade==="perfect"?"\n最後は先生まで絶叫させた":"";
  showActions(`学園祭のお化け屋敷でおばけ役をやったら、悲鳴が ${fmtDist(d)} 先まで届いた👻\n${title}【${rank}】${senLine}`);
}

/* ---------- 入力 ---------- */
function press(){initAudio();if(state==="idle")start();else if(state==="play")scare()}
stage.addEventListener("pointerdown",e=>{if(e.target.closest&&e.target.closest(".actions"))return;e.preventDefault();press()});
document.addEventListener("keydown",e=>{if((e.code==="Space"||e.code==="Enter")&&(e.target===stage||e.target===document.body)){e.preventDefault();
  if(state==="end"){initAudio();reset();start();return}press()}});

/* ---------- 毎フレーム ---------- */
let last=performance.now();
const tmp=new THREE.Vector3(),tmp2=new THREE.Vector3();
function tick(now){
  const dt=Math.min(0.05,(now-last)/1000)*(window.__hbSpeed||1);last=now;
  const ease=r=>1-Math.exp(-dt*r);
  if(active===house){
    for(const L of lanterns){L.lg.intensity=0.75+Math.sin(now/170+L.ph)*0.12+Math.random()*0.08;L.pk.rotation.z=Math.sin(now/900+L.ph)*0.06}
    // 客
    const g=cur;
    if(g){
      if(g.state==="walk"){
        if(g.pauseAt!==null&&g.z>=g.pauseAt&&!g.paused){g.paused=true;g.state="pause";g.pt=0}
        else if(g.pause2&&g.z>=g.pause2&&!g.paused2){g.paused2=true;g.state="pause";g.pt=0;g.pauseT=0.9}
        else{g.z+=g.speed*dt;if(g.T.boss&&g.paused2)g.speed=Math.min(2.6,g.speed+dt*3)}
      }else if(g.state==="pause"){g.pt+=dt;g.members.forEach(m=>m.g.rotation.y=Math.sin(g.pt*3.2)*0.9);if(g.light)g.light.target.position.x=Math.sin(g.pt*3.2)*2.2;
        if(g.pt>=g.pauseT){g.state="walk";g.members.forEach(m=>m.g.rotation.y=0);g.light.target.position.x=0.1}}
      else if(g.state==="laugh"){g.z+=dt*0.3}
      else if(g.state==="turn"){g.members.forEach(m=>m.g.rotation.y+=(Math.PI-m.g.rotation.y)*ease(10))}
      else if(g.state==="scared"||g.state==="tough"){g.scareT+=dt;g.members.forEach((m,i)=>{
          const k=g.state==="tough"?0:Math.max(0,Math.sin(Math.min(1,g.scareT*2.2)*Math.PI))*0.55*g.lvl;
          m.body.position.y=k;m.arms.forEach(a=>a.rotation.x+=((g.state==="tough"?0:-2.8)-a.rotation.x)*ease(14));
          if(g.state==="tough"){m.legs.forEach((l,j)=>l.rotation.z=Math.sin(now/30+j)*0.12)}});
        if(g.state==="tough"&&g.scareT>1.3){g.state="walk"}}
      else if(g.state==="flee"){g.z-=dt*6;g.members.forEach(m=>{m.g.rotation.y+=(Math.PI-m.g.rotation.y)*ease(12);m.body.position.y=Math.abs(Math.sin(now/70))*0.12;
          m.legs.forEach((l,j)=>l.rotation.x=Math.sin(now/70+j*Math.PI)*0.9)});if(g.z<-14)guestDone(g)}
      if(g.state==="walk"||g.state==="laugh"){const ph=now/(260/Math.max(0.6,g.speed));g.members.forEach((m,i)=>{m.legs.forEach((l,j)=>l.rotation.x=Math.sin(ph+j*Math.PI+i)*0.5);m.body.position.y=Math.abs(Math.sin(ph+i))*0.04;
          if(g.T.tough)m.g.rotation.y=Math.sin(ph*0.5)*0.2});
        if(Math.floor(ph/Math.PI)!==g.lastStep){g.lastStep=Math.floor(ph/Math.PI);SE.step(Math.max(0,Math.min(1,(g.z+14)/14)))}
        if(g.z>3.2&&g.state==="walk"&&state==="play")guestDone(g)}
      if(cur===g){placeGuest(g);near=g.state==="walk"||g.state==="pause"?Math.max(0,Math.min(1,(g.z+10)/10)):0}
    }
    // おばけ
    ghostT+=dt;
    let gp=HIDE,gr=-0.5;
    if(ghostState==="out"){gp=OUT;gr=-1.15}
    else if(ghostState==="sad"){gp=tmp.set(1.05,0,0.6);gr=-0.9}
    else if(ghostState==="faint"){gp=tmp.set(1.1,0,0.75);gr=-0.9}
    ghost.position.lerp(gp,ease(ghostState==="out"?22:6));ghost.rotation.y+=(gr-ghost.rotation.y)*ease(10);
    ghost.rotation.z+=((ghostState==="faint"?-1.3:0)-ghost.rotation.z)*ease(ghostState==="faint"?5:8);
    ghost.position.y=ghostState==="out"?Math.max(0,Math.sin(Math.min(1,ghostT*3)*Math.PI)*0.35):ghostState==="faint"?0:Math.sin(now/600)*0.04;
    gArms.forEach((a,i)=>{const t=ghostState==="out"?(i?-1.9:1.9):(i?-0.5:0.5);a.rotation.z+=(t-a.rotation.z)*ease(14)});
    gLight.intensity*=Math.pow(0.4,dt);
    swing*=Math.pow(0.3,dt);lineG.rotation.x=Math.sin(now/90)*swing*0.9+Math.sin(now/700)*0.08;
    if(ghostState==="back"){ghostState="hide"}
    // カメラ
    camera.position.lerp(CAM.pos,ease(3));camLook.lerp(CAM.look,ease(3));
    if(shake>0){shake-=dt;camera.position.x+=(Math.random()-.5)*shake*0.18;camera.position.y+=(Math.random()-.5)*shake*0.18}
    camera.lookAt(camLook);
  }
  // 悲鳴の旅
  if(travel&&state==="travel"){
    travel.u=Math.min(1,travel.u+dt/travel.dur);
    const e=1-Math.pow(1-travel.u,2.2),D=travel.d,c=Math.pow(10,e*Math.log10(Math.max(D,1.0001)));
    while(travel.passed<LANDS.length&&c>=LANDS[travel.passed][0]&&D>=LANDS[travel.passed][0]){
      landEl.textContent=LANDS[travel.passed][1];landEl.classList.remove("show");void landEl.offsetWidth;landEl.classList.add("show");SE.pass(travel.passed);travel.passed++}
    distEl.innerHTML=`${fmtDist(c)}<small>悲鳴が届いた距離</small>`;
    if(c>2000&&!travel.space){travel.space=true;active=space;flash(1,0.6);SE.whoosh()}
    if(active===outside){
      const r=Math.max(1,c);wave.scale.setScalar(r);wave2.scale.setScalar(Math.max(1,r*0.7));
      wave.material.opacity=0.9;wave2.material.opacity=0.5;
      const h=Math.min(1100,4+r*0.7);camera.position.lerp(tmp.set(6.4+h*0.3,h,-8-14-h*0.75),ease(5));camLook.lerp(tmp2.set(6.4,Math.max(0,5-r*0.05),-6),ease(5));camera.lookAt(camLook)}
    else{
      const km=c/1000,th=Math.min(Math.PI,km/6371);
      if(th<Math.PI*0.999){sRing.visible=true;shell.visible=false;const rr=10.05*Math.sin(th);sRing.scale.setScalar(Math.max(0.05,rr));
        sRing.position.copy(P0).multiplyScalar(10.05*Math.cos(th));sRing.lookAt(P0.clone().multiplyScalar(100));
        const ch=Math.max(1.6,rr*3.4),cp=tmp.copy(P0).multiplyScalar(10.05+ch).add(tmp2.set(ch*0.35,ch*0.2,0));
        if(!travel.snapped){travel.snapped=true;camera.position.copy(cp);camLook.copy(P0).multiplyScalar(10.05)}
        camera.position.lerp(cp,ease(5));camLook.lerp(tmp2.copy(P0).multiplyScalar(10.05*Math.cos(th)),ease(5))}
      else{sRing.visible=false;shell.visible=true;const extra=(km-20015)/(384400-20015);const R=10.2+Math.max(0,extra)*60;shell.scale.setScalar(R);
        camera.position.lerp(tmp.set(0,R*0.6+20,R*1.5+40),ease(3));camLook.lerp(tmp2.set(-10,8,-12),ease(3))}
      camera.lookAt(camLook)}
    if(now-travel.last>400){travel.last=now;SE.scream(0.25,900+Math.random()*600)}
    if(travel.u>=1&&!travel.done){travel.done=true;later(endTravel,300)}
  }else if(active!==house){camera.lookAt(camLook)}
  for(let i=fx.length-1;i>=0;i--){const f=fx[i];f.t+=dt;f.vel.y+=f.grav*dt;f.s.position.addScaledVector(f.vel,dt);
    if(f.spin){f.s.rotation.x+=f.spin*dt;f.s.rotation.z+=f.spin*0.7*dt}
    if(f.grow){const k=Math.max(0.01,f.base+f.grow*(f.t/f.life));f.s.scale.set(k,k*f.ratio,1)}
    if(f.s.material)f.s.material.opacity=f.op*Math.max(0,1-Math.max(0,f.t-f.life*0.6)/(f.life*0.4));
    if(f.t>=f.life){f.parent.remove(f.s);fx.splice(i,1)}}
  renderer.render(active,camera);
  requestAnimationFrame(tick);
}
function resize(){const r=stage.getBoundingClientRect();if(!r.width||!r.height)return;
  renderer.setSize(r.width,r.height,false);camera.aspect=r.width/r.height;camera.updateProjectionMatrix()}
new ResizeObserver(resize).observe(stage);resize();
reset();
window.__hb={get state(){return state},get total(){return total},get cur(){return cur?{type:cur.type,z:cur.z,state:cur.state,speed:cur.T.speed,tapped:cur.tapped}:null},scare,get results(){return results},setTotal(v){total=v}};
requestAnimationFrame(tick);
})();
