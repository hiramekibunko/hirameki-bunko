<style>

@media (prefers-reduced-motion:reduce){.actions,.dist.slam,.top .bpm i{animation:none}.judge.on,.title.on,.say.on{animation-duration:.01s}}

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const $=id=>document.getElementById(id);
const stage=$("stage"),msg=$("msg"),rankEl=$("rank"),topEl=$("top"),lvEl=$("lv"),scoreEl=$("score"),bpmEl=$("bpm"),heartEl=$("heart"),titleEl=$("title"),judgeEl=$("judge"),sayEl=$("say"),
  warnEl=$("warn"),distEl=$("dist"),listEl=$("list"),flashEl=$("flash"),redvEl=$("redv"),actions=$("actions"),shareA=$("share"),againBtn=$("again"),muteBtn=$("mute");
if(!window.THREE){msg.textContent="3Dを読み込めませんでした";rankEl.textContent="通信状態を確認して再読み込みしてください";return}

/* ---------- 記録 ---------- */
let bestBpm=null,bestScore=null;
try{bestBpm=Number(localStorage.getItem("hb-obake-bpm"))||null;bestScore=Number(localStorage.getItem("hb-obake-score"))||null}catch(e){}

/* ---------- 音（Web Audioで合成） ---------- */
const AC=window.AudioContext||window.webkitAudioContext;
let ac=null,master,bgmBus,sfxBus,noiseBuf,muted=false;
try{muted=localStorage.getItem("hb-mute")==="1"}catch(e){}
function showMute(){muteBtn.textContent=muted?"音 OFF":"音 ON";muteBtn.setAttribute("aria-pressed",String(muted))}
showMute();
function initAudio(){
  if(!AC)return;
  if(ac){if(ac.state==="suspended")ac.resume();return}
  ac=new AC();
  const comp=ac.createDynamicsCompressor();comp.threshold.value=-10;comp.ratio.value=3;comp.connect(ac.destination);
  master=ac.createGain();master.gain.value=muted?0:0.95;master.connect(comp);
  bgmBus=ac.createGain();bgmBus.gain.value=0.6;bgmBus.connect(master);
  sfxBus=ac.createGain();sfxBus.gain.value=0.85;sfxBus.connect(master);
  noiseBuf=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate);
  const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  startBgm();
}
muteBtn.addEventListener("pointerdown",e=>e.stopPropagation());
muteBtn.addEventListener("click",e=>{e.stopPropagation();muted=!muted;showMute();
  try{localStorage.setItem("hb-mute",muted?"1":"0")}catch(err){}
  initAudio();if(master)master.gain.setTargetAtTime(muted?0:0.95,ac.currentTime,0.02)});
function tone(f,t,dur,{type="sine",vol=0.3,to=null,bus=sfxBus,attack=0.005,lp=null,vib=0}={}){
  if(!ac||!(vol>0.0005))return;const o=ac.createOscillator(),g=ac.createGain();o.type=type;
  o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+dur);
  if(vib){const l=ac.createOscillator(),lg=ac.createGain();l.frequency.value=5.5;lg.gain.value=vib;l.connect(lg);lg.connect(o.frequency);l.start(t);l.stop(t+dur+0.05)}
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+attack);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  let n=o;if(lp){const fl=ac.createBiquadFilter();fl.type="lowpass";fl.frequency.value=lp;o.connect(fl);n=fl}
  n.connect(g);g.connect(bus);o.start(t);o.stop(t+dur+0.02)}
function noise(t,dur,{vol=0.3,type="lowpass",f=1000,to=null,q=1,attack=0.005,bus=sfxBus}={}){
  if(!ac||!(vol>0.0005))return;const s=ac.createBufferSource(),fl=ac.createBiquadFilter(),g=ac.createGain();
  s.buffer=noiseBuf;s.loop=true;fl.type=type;fl.Q.value=q;fl.frequency.setValueAtTime(f,t);
  if(to)fl.frequency.exponentialRampToValueAtTime(to,t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+attack);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(fl);fl.connect(g);g.connect(bus);s.start(t);s.stop(t+dur+0.02)}
const T0=(d)=>ac?ac.currentTime+(d||0):0;
const SE={
  step(){const t=T0();noise(t,0.08,{vol:0.1,f:420,attack:0.003});tone(80,t,0.08,{vol:0.05})},
  whisper(v){const t=T0();noise(t,0.9,{vol:0.05+v*0.07,type:"bandpass",f:2600,to:1800,q:3,attack:0.3})},
  giggle(v){const t=T0();for(let i=0;i<4;i++)tone(700-i*20,t+i*0.11,0.08,{type:"triangle",vol:0.04+v*0.05,to:600})},
  creak(v){const t=T0();tone(180+Math.random()*60,t,0.6,{type:"sawtooth",vol:0.04+v*0.06,to:260,lp:900,attack:0.08,vib:14})},
  rattle(v){const t=T0();for(let i=0;i<6;i++)noise(t+i*0.06,0.05,{vol:0.12+v*0.22,f:900,attack:0.002});tone(120,t,0.4,{type:"square",vol:0.03+v*0.05,lp:600})},
  buzz(v){const t=T0();tone(100,t,0.25,{type:"sawtooth",vol:0.06+v*0.07,lp:1400});noise(t,0.2,{vol:0.05+v*0.06,type:"highpass",f:4000})},
  heart(v){const t=T0();tone(55,t,0.12,{vol:0.2+v*0.3,to:40});tone(52,t+0.16,0.12,{vol:0.15+v*0.25,to:38})},
  breath(v){const t=T0();noise(t,0.7,{vol:0.05+v*0.08,f:700,to:300,attack:0.25})},
  sting(lv){const t=T0();const v=0.55+lv*0.09;
    noise(t,0.6,{vol:v,f:3000,to:400,attack:0.002});tone(110,t,0.6,{type:"sawtooth",vol:v*0.5,to:55,lp:2500});
    [523,554,587,622].forEach(f=>tone(f*2,t,0.7,{type:"sawtooth",vol:v*0.12,lp:5000,vib:30}));
    tone(900,t+0.02,0.7,{type:"sawtooth",vol:v*0.25,to:1400,lp:3500,vib:60})},
  myScream(){const t=T0(0.08);const f=900+Math.random()*200;tone(f,t,1.0,{type:"sawtooth",vol:0.18,to:f*1.6,attack:0.02,lp:3200,vib:60});noise(t,0.9,{vol:0.2,type:"bandpass",f:2200,q:2,attack:0.02})},
  calm(){const t=T0(0.05);tone(660,t,0.25,{type:"triangle",vol:0.1});tone(880,t+0.1,0.3,{type:"triangle",vol:0.08})},
  perfect(){const t=T0(0.05);[880,1175,1568].forEach((f,i)=>tone(f,t+i*0.06,0.3,{type:"square",vol:0.07,lp:5000}))},
  slap(){const t=T0();noise(t,0.12,{vol:0.6,f:900,attack:0.001});tone(220,t,0.1,{type:"triangle",vol:0.25,to:110})},
  door(){const t=T0();noise(t,0.15,{vol:0.6,type:"highpass",f:900,attack:0.001});tone(90,t,0.3,{vol:0.4,to:50})},
  chime(){const t=T0();[[659,0],[523,.4],[587,.8],[392,1.2]].forEach(([f,d])=>{tone(f,t+d,1.1,{vol:0.18,attack:0.01});tone(f*2,t+d,0.6,{vol:0.04})})},
  fanfare(){const t=T0();[[523,0],[659,.12],[784,.24],[1047,.36],[988,.62],[1047,.74],[1319,.86]].forEach(([f,d])=>{tone(f,t+d,0.34,{type:"square",vol:0.1,lp:3500});tone(f/2,t+d,0.32,{type:"triangle",vol:0.14})})},
  sad(){const t=T0();[[392,0],[370,.35],[349,.7],[330,1.05]].forEach(([f,d])=>tone(f,t+d,0.6,{type:"sawtooth",vol:0.08,lp:1200}))},
  // 余興用
  bell(){const t=T0();[2093,2637,3520].forEach((f,i)=>tone(f,t,1.5-i*0.35,{vol:0.16/(i+1),attack:0.002}))},
  crack(){const t=T0();for(let i=0;i<3;i++)noise(t+i*0.05,0.03,{vol:0.4,type:"highpass",f:1800,attack:0.001});tone(140,t,0.12,{type:"square",vol:0.05,lp:600})},
  slide(){const t=T0();noise(t,0.4,{vol:0.13,type:"bandpass",f:1100,to:2600,q:2,attack:0.05})},
  rustle(){const t=T0();noise(t,1.1,{vol:0.1,type:"bandpass",f:3600,q:1.4,attack:0.35})},
  zip(){const t=T0();noise(t,0.2,{vol:0.25,type:"bandpass",f:1400,to:6000,q:3,attack:0.01})},
  hehe(){const t=T0();[0,0.17,0.34].forEach(d=>tone(175,t+d,0.13,{type:"sawtooth",vol:0.08,lp:900,to:140,vib:8}))},
  squeak(){const t=T0();tone(480,t,0.9,{type:"sawtooth",vol:0.07,to:820,lp:1900,vib:30,attack:0.05})},
  click(){const t=T0();noise(t,0.03,{vol:0.45,type:"highpass",f:2500,attack:0.001});tone(60,t,0.35,{type:"sawtooth",vol:0.07,to:38,lp:300})},
  clack(){const t=T0();noise(t,0.07,{vol:0.35,f:1300,attack:0.001});tone(110,t,0.1,{type:"triangle",vol:0.12})},
  chalk(){const t=T0();for(let i=0;i<7;i++)noise(t+i*0.19,0.13,{vol:0.08,type:"bandpass",f:3600+Math.random()*1800,q:9,attack:0.01})},
  thud(){const t=T0();noise(t,0.35,{vol:0.7,f:500,to:140,attack:0.002});tone(72,t,0.35,{vol:0.45,to:42})},
  popper(){const t=T0();noise(t,0.25,{vol:1,type:"highpass",f:1400,attack:0.001});tone(320,t,0.09,{type:"square",vol:0.3,to:110});
    for(let i=0;i<10;i++)noise(t+0.12+i*0.07,0.05,{vol:0.05,type:"highpass",f:5000})}
};
/* BGM：不気味な持続音とオルゴール。レベルが上がるほど低音が重くなり、驚かしの直前はすっと静かになる */
let bgmMode="idle",tension=0,hush=0;
function startBgm(){
  const hz=m=>440*Math.pow(2,(m-69)/12);
  let next=ac.currentTime+0.1,step=0,lastMode="";
  const box=[81,0,84,0,88,87,84,0, 81,0,84,0,83,0,80,0, 81,0,84,88,91,89,88,84, 86,0,83,0,80,0,0,0];
  setInterval(()=>{
    if(bgmMode!==lastMode){lastMode=bgmMode;step=0;next=Math.max(next,ac.currentTime+0.05)}
    while(next<ac.currentTime+0.3){
      let dur;

function nextAfter(ms){later(()=>{const l=L[lv];l.scaring=false;l.leaving=true;msg.textContent="";if(lv<4)beginLevel(lv+1);else finish()},ms)}
function judgeLevel(dt,early){
  if(results[lv])return;
  const a=Math.abs(dt);let grade,pts;
  if(early){grade="EARLY";pts=0}
  else if(a>2){grade="MISS";pts=0}
  else{pts=Math.round(1000*(1-a/2));grade=a<=0.1?"PERFECT":a<=0.5?"GREAT":a<=1?"GOOD":"OK"}
  results[lv]={grade,pts,dt};score+=pts;updHud();
  const add={PERFECT:0,GREAT:6,GOOD:16,OK:28,MISS:46,EARLY:34}[grade];
  const nb=bpm+add-(grade==="PERFECT"?2:0);
  const label={PERFECT:"PERFECT!",GREAT:"GREAT",GOOD:"GOOD",OK:"OK",MISS:"MISS",EARLY:"早すぎ"}[grade];
  const sub=early?"ビビって先に押した":grade==="MISS"?"驚かされっぱなし":`${pts}点　${a<0.005?"ぴったり":dt<0?"少し早い":"少し遅い"}（${a.toFixed(2)}秒）`;
  setBpm(nb);
  if(early){show(judgeEl,label+`<small>${sub}</small>`);SE.calm();msg.textContent="……まだ来てないのに";return}
  show(judgeEl,label+`<small>${sub}</small>`);
  if(grade==="PERFECT"){SE.perfect();msg.textContent="平常心……！"}
  else if(grade==="MISS"||grade==="OK"){SE.myScream();redFlash();shake=Math.max(shake,1.2);camKick=1;msg.textContent="ぎゃあああ！！"}
  else{camKick=Math.max(camKick,0.4);msg.textContent=grade==="GREAT"?"……っ！":"ひっ！"}

}

  later(()=>{SE.chime();bgmMode="result";flash(0.8,0.8);
    lookTarget.set(0,1.3,-30);
    distEl.innerHTML=`${bpm}<span style="font-size:.45em"> bpm</span><small>出口での心拍数</small><em>【${rankT}】</em>`;

  },1400);

function cue(l,v,fake){
  const k=l.cueKind;
  if(k==="whisper"){SE.whisper(v);if(Math.random()<0.5)SE.giggle(v);if(l.actor)l.actor.head.rotation.z=(Math.random()-.5)*0.15*v}
  else if(k==="creak"){SE.creak(v);l.g.rotation.z=(Math.random()-.5)*0.4*v}
  else if(k==="rattle"){SE.rattle(v);l._shake=1}
  else if(k==="flicker"){SE.buzz(v);l.flick=0.25+v*0.2;if(fake&&l.hd)l.hd.rotation.y=0.25}
  else if(k==="steps"){SE.step();SE.breath(v)}
  if(!fake)SE.heart(v);
}

    while(teaseQ.length&&lvT>=teaseQ[0].t)teaseQ.shift().fn();

    if(toScare<1.4){cueClock-=dt;if(cueClock<=0){cueClock=0.34-0.14*(1-toScare/1.4);cue(l,1-toScare/1.4,false)}hush=Math.min(1,(1.4-toScare)/0.5)}

    if(l.scaring){l.k=Math.min(1,l.k+dt*9);l.pose(l.k,t)}
    else if(l.leaving&&l.k>0){l.k=Math.max(0,l.k-dt*0.5);l.pose(l.k,t)}
