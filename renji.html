<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;700&family=Zen+Old+Mincho:wght@900&display=swap">
<style>
/* 縦長(9:16)の3D画面：夜のキッチンのレンジ。下に大きなスタート／ストップボタン */
:root{--bg:#0b0a0d;--screen:#1b1714;--fg:#f3eee6;--line:#3a322b;--accent:#ffcf33;--hot:#ff8a3d;--danger:#ff5a4a;--green:#7dffb0;
  --font-display:"Dela Gothic One","Zen Kaku Gothic New",system-ui,sans-serif;
  --font-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --font-mincho:"Zen Old Mincho","Hiragino Mincho ProN","Yu Mincho",serif;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);display:grid;place-items:center;
  padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.screen{height:min(100%,860px);aspect-ratio:9/16;max-width:100%;background:var(--screen);border-radius:18px;
  display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.6)}
@media (max-width:520px){body{padding:0}.screen{height:100%;width:100%;aspect-ratio:auto;border-radius:0;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}}
.bar{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.bar a{color:var(--fg);text-decoration:none;font-size:14px;padding:6px 12px;border-radius:99px;background:var(--line)}
.bar a:focus-visible,.mute:focus-visible{outline:2px solid var(--accent)}
.ttl{font-family:var(--font-mincho);font-weight:900;font-size:18px;margin:0}
.no{margin-left:auto;font-size:11px;opacity:.6;letter-spacing:.1em}
.mute{all:unset;cursor:pointer;font-size:12px;padding:5px 10px;border-radius:99px;border:1px solid var(--line);white-space:nowrap}

.stage{flex:1;min-height:0;position:relative;user-select:none;-webkit-user-select:none;touch-action:manipulation;background:#000;cursor:pointer}
.stage:focus-visible{outline:3px solid var(--accent);outline-offset:-4px}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.white{position:absolute;inset:0;background:#fffaf0;opacity:0;pointer-events:none}
.top{position:absolute;top:10px;left:12px;right:12px;display:flex;justify-content:space-between;font-size:11px;opacity:.8;text-shadow:0 1px 2px #000;pointer-events:none;font-variant-numeric:tabular-nums}
.dist{position:absolute;top:34px;left:0;right:0;text-align:center;font-family:var(--font-display);font-size:clamp(26px,8vw,40px);
  color:#fff;text-shadow:0 2px 0 #1f2430,0 0 12px rgba(0,0,0,.5);font-variant-numeric:tabular-nums;pointer-events:none}
.dist small{display:block;font-family:var(--font-body);font-weight:700;font-size:13px;letter-spacing:.12em;opacity:.85}
.dist em{display:block;font-style:normal;font-family:var(--font-mincho);font-weight:900;font-size:17px;color:var(--accent);margin-top:2px}
.dist.slam{animation:slam .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes slam{0%{transform:scale(1.9);opacity:.2}100%{transform:scale(1);opacity:1}}
.land{position:absolute;top:44%;left:0;right:0;text-align:center;font-family:var(--font-mincho);font-weight:900;font-size:20px;color:#fff;
  text-shadow:0 2px 0 #000,0 0 14px rgba(0,0,0,.6);pointer-events:none;opacity:0}
.land.show{animation:land 1.1s ease-out}
@keyframes land{0%{opacity:0;transform:translateY(10px) scale(.9)}15%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0;transform:translateY(-12px)}}
.hud{position:absolute;left:0;right:0;bottom:0;padding:40px 16px 14px;text-align:center;pointer-events:none;
  background:linear-gradient(transparent,rgba(11,10,13,.85))}
.msg{font-family:var(--font-display);font-size:clamp(20px,5.6vw,28px);letter-spacing:.04em;min-height:1.4em;text-shadow:0 2px 0 #000}
.rank{font-family:var(--font-mincho);font-weight:900;font-size:15px;color:var(--accent);min-height:1.5em;text-shadow:0 1px 0 #000}
.actions{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:10px;pointer-events:auto;animation:pop .35s ease-out}
.actions .row{display:flex;gap:10px;justify-content:center}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.btn{font:700 15px var(--font-body);border:0;border-radius:99px;padding:11px 20px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:focus-visible,.support:focus-visible,.big:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn.x{background:#000;color:#fff;box-shadow:0 0 0 1px #555}
.btn.again{background:var(--accent);color:#1f2430}
.support{font-size:12px;color:var(--fg);opacity:.7;text-decoration:underline;text-underline-offset:3px}
.ctrl{flex:0 0 auto;display:flex;justify-content:center;padding:14px 0 16px;border-top:1px solid var(--line);background:#14110f}
.big{font:400 22px var(--font-display);letter-spacing:.08em;border:0;border-radius:99px;width:min(78%,300px);padding:16px 0;cursor:pointer;
  background:var(--hot);color:#1f1209;box-shadow:0 5px 0 #8a3f12;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 #8a3f12}
.big.stop{background:var(--danger);color:#fff;box-shadow:0 5px 0 #7a1d16}
.big:disabled{opacity:.35;cursor:default;transform:none}
@media (prefers-reduced-motion:reduce){.actions,.dist.slam,.land.show{animation:none}.land.show{opacity:1}}
</style>
</head>
<body>
<main class="screen">
  <div class="bar">
    <a href="./">← 棚へ</a>
    <h1 class="ttl">レンジで十秒</h1>
    <span class="no">ひ-1-3</span>
    <button class="mute" id="mute" type="button" aria-pressed="false">音 ON</button>
  </div>
  <div class="stage" id="stage" tabindex="0" role="application" aria-label="レンジで十秒。ボタンかタップでスタートとストップ">
    <div class="top"><span>ベスト誤差 <b id="best">―</b></span><span>最長 <b id="bestD">―</b></span></div>
    <div class="dist" id="dist"></div>
    <div class="land" id="land"></div>
    <div class="white" id="white"></div>
    <div class="hud">
      <div class="msg" id="msg">表示が壊れたレンジ</div>
      <div class="rank" id="rank" aria-live="polite">体感でぴったり10秒チンしよう</div>
      <div class="actions" id="actions" hidden>
        <div class="row">
          <a class="btn x" id="share" href="#" target="_blank" rel="noopener">𝕏 でシェア</a>
          <button class="btn again" id="again" type="button">もう一度</button>
        </div>
        <a class="support" href="https://ofuse.me/0825d42b" target="_blank" rel="noopener">☕ ひらめき文庫に差し入れ</a>
      </div>
    </div>
  </div>
  <div class="ctrl"><button class="big" id="big" type="button">スタート</button></div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const $=id=>document.getElementById(id);
const stage=$("stage"),msg=$("msg"),rankEl=$("rank"),distEl=$("dist"),landEl=$("land"),whiteEl=$("white"),bigBtn=$("big"),
  actions=$("actions"),shareA=$("share"),againBtn=$("again"),muteBtn=$("mute"),bestEl=$("best"),bestDEl=$("bestD");
if(!window.THREE){msg.textContent="3Dを読み込めませんでした";rankEl.textContent="通信状態を確認して再読み込みしてください";return}

/* ---------- 記録 ---------- */
let best=null,bestD=null;
try{best=Number(localStorage.getItem("hb-renji-err"));if(!isFinite(best)||localStorage.getItem("hb-renji-err")===null)best=null;bestD=Number(localStorage.getItem("hb-renji-dist"))||null}catch(e){}
function fmtDist(m){if(m<1000)return Math.round(m)+" m";const km=m/1000;return km<100?km.toFixed(1)+" km":Math.round(km).toLocaleString("ja-JP")+" km"}
const showBest=()=>{bestEl.textContent=best!==null?best.toFixed(2)+" 秒":"―";bestDEl.textContent=bestD?fmtDist(bestD):"―"};
showBest();

/* ---------- 音（Web Audioで合成） ---------- */
const AC=window.AudioContext||window.webkitAudioContext;
let ac=null,master,bgmBus,sfxBus,noiseBuf,muted=false;
try{muted=localStorage.getItem("hb-mute")==="1"}catch(e){}
function showMute(){muteBtn.textContent=muted?"音 OFF":"音 ON";muteBtn.setAttribute("aria-pressed",String(muted))}
showMute();
function initAudio(){
  if(!AC)return;
  if(ac){if(ac.state==="suspended")ac.resume();return}
  ac=new AC();
  master=ac.createGain();master.gain.value=muted?0:0.9;master.connect(ac.destination);
  bgmBus=ac.createGain();bgmBus.gain.value=0.55;bgmBus.connect(master);
  sfxBus=ac.createGain();sfxBus.gain.value=0.8;sfxBus.connect(master);
  noiseBuf=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate);
  const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  startBgm();
}
muteBtn.addEventListener("pointerdown",e=>e.stopPropagation());
muteBtn.addEventListener("click",e=>{e.stopPropagation();muted=!muted;showMute();
  try{localStorage.setItem("hb-mute",muted?"1":"0")}catch(err){}
  initAudio();if(master)master.gain.setTargetAtTime(muted?0:0.9,ac.currentTime,0.02)});
function tone(f,t,dur,{type="sine",vol=0.3,to=null,bus=sfxBus,attack=0.005,lp=null}={}){
  if(!ac)return;const o=ac.createOscillator(),g=ac.createGain();o.type=type;
  o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+attack);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  let n=o;if(lp){const fl=ac.createBiquadFilter();fl.type="lowpass";fl.frequency.value=lp;o.connect(fl);n=fl}
  n.connect(g);g.connect(bus);o.start(t);o.stop(t+dur+0.02)}
function noise(t,dur,{vol=0.3,type="lowpass",f=1000,to=null,q=1,attack=0.005,bus=sfxBus}={}){
  if(!ac)return;const s=ac.createBufferSource(),fl=ac.createBiquadFilter(),g=ac.createGain();
  s.buffer=noiseBuf;s.loop=true;fl.type=type;fl.Q.value=q;fl.frequency.setValueAtTime(f,t);
  if(to)fl.frequency.exponentialRampToValueAtTime(to,t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+attack);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(fl);fl.connect(g);g.connect(bus);s.start(t);s.stop(t+dur+0.02)}
const T0=()=>ac?ac.currentTime:0;
/* レンジのブーンという音（鳴らしっぱなし） */
let hum=null;
function humStart(){if(!ac||hum)return;const t=T0();
  const o=ac.createOscillator(),o2=ac.createOscillator(),g=ac.createGain(),fl=ac.createBiquadFilter();
  o.type="sawtooth";o.frequency.value=58;o2.type="sine";o2.frequency.value=120;fl.type="lowpass";fl.frequency.value=380;
  o.connect(fl);o2.connect(fl);fl.connect(g);g.connect(sfxBus);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.22,t+0.15);
  const s=ac.createBufferSource(),nf=ac.createBiquadFilter(),ng=ac.createGain();s.buffer=noiseBuf;s.loop=true;nf.type="bandpass";nf.frequency.value=900;ng.gain.value=0.05;
  s.connect(nf);nf.connect(ng);ng.connect(g);o.start(t);o2.start(t);s.start(t);hum={o,o2,s,g}}
function humStop(){if(!hum)return;const t=T0();hum.g.gain.setTargetAtTime(0.0001,t,0.03);const h=hum;hum=null;setTimeout(()=>{try{h.o.stop();h.o2.stop();h.s.stop()}catch(e){}},300)}
const SE={
  start(){const t=T0();tone(1200,t,0.06,{type:"square",vol:0.12});tone(1600,t+0.08,0.06,{type:"square",vol:0.12});noise(t,0.08,{vol:0.2,f:2000})},
  chin(){const t=T0();[2093,3136,4186].forEach((f,i)=>tone(f,t,1.6-i*0.3,{vol:0.32/(i+1),attack:0.002}))},
  door(){const t=T0();noise(t,0.08,{vol:0.4,type:"highpass",f:1500,attack:0.001});tone(180,t+0.05,0.3,{type:"sawtooth",vol:0.06,to:120,lp:900})},
  bell(){const t=T0();tone(784,t,0.7,{vol:0.3});tone(622,t+0.45,1.0,{vol:0.3})},
  phone(){const t=T0();for(let k=0;k<2;k++)for(let i=0;i<10;i++)tone(i%2?1300:1600,t+k*0.55+i*0.035,0.04,{type:"square",vol:0.07})},
  cat(){const t=T0();tone(600,t,0.2,{type:"sawtooth",vol:0.13,to:1000,attack:0.03,lp:2500});tone(1000,t+0.2,0.45,{type:"sawtooth",vol:0.11,to:520,lp:2500})},
  toaster(){const t=T0();noise(t,0.1,{vol:0.4,type:"highpass",f:1200,attack:0.001});[1760,2637].forEach((f,i)=>tone(f,t+0.08,1.1-i*0.3,{vol:0.22/(i+1)}))},
  cold(){const t=T0();[1568,1319,1047,880].forEach((f,i)=>tone(f,t+i*0.08,0.3,{type:"triangle",vol:0.12}));tone(140,t+0.4,0.5,{type:"square",vol:0.14,lp:900})},
  clunk(){const t=T0();tone(260,t,0.15,{type:"square",vol:0.2,to:180,lp:1200});tone(240,t+0.2,0.15,{type:"square",vol:0.2,to:160,lp:1200})},
  spark(){const t=T0();for(let i=0;i<6;i++)noise(t+Math.random()*0.4,0.03,{vol:0.3,type:"highpass",f:3000+Math.random()*3000,attack:0.001})},
  boom(){const t=T0();noise(t,1.8,{vol:1.0,f:2400,to:90,attack:0.002});tone(70,t,1.2,{vol:0.6,to:30});noise(t+0.3,2.5,{vol:0.2,f:500,attack:0.3})},
  steam(){const t=T0();noise(t,1.2,{vol:0.3,type:"bandpass",f:1800,to:4500,q:0.6,attack:0.2})},
  whoosh(){const t=T0();noise(t,0.6,{vol:0.45,type:"bandpass",f:400,to:3500,q:0.7})},
  pass(i){const t=T0();const f=[523,587,659,784,880,988,1047,1175,1319,1568,1760][Math.min(i,10)];tone(f,t,0.25,{type:"triangle",vol:0.18});tone(f*2,t,0.18,{vol:0.05})},
  fanfare(){const t=T0();const m=[[523,0],[659,.12],[784,.24],[1047,.36],[988,.62],[1047,.74],[1319,.86]];
    m.forEach(([f,d])=>{tone(f,t+d,0.32,{type:"square",vol:0.1,lp:3500});tone(f/2,t+d,0.3,{type:"triangle",vol:0.14})});
    for(let i=0;i<8;i++)tone(2000+Math.random()*2500,t+0.9+i*0.05,0.12,{vol:0.05})},
  sting(){const t=T0();[[392,0],[370,.25],[349,.5],[294,.8]].forEach(([f,d])=>tone(f,t+d,0.4,{type:"square",vol:0.1,lp:1800}))}
};
/* BGM：待機は静かな夜のキッチン、チン中は毎回テンポが違うハラハラ曲（数えるのに使えない） */
let bgmMode="idle",runStart=0,runBpm=120;
function startBgm(){
  const hz=m=>440*Math.pow(2,(m-69)/12);
  let next=ac.currentTime+0.1,step=0,lastMode="";
  const idleChords=[[57,60,64],[53,57,60],[55,59,62],[52,55,59]];
  const runBass=[45,45,57,45,48,45,55,47];
  setInterval(()=>{
    if(bgmMode!==lastMode){lastMode=bgmMode;step=0;next=Math.max(next,ac.currentTime+0.05)}
    while(next<ac.currentTime+0.3){
      let dur;
      if(bgmMode==="idle"||bgmMode==="end"){
        dur=60/72/2;
        if(step%8===0){const c=idleChords[(step/8)%4];c.forEach(m=>tone(hz(m),next,dur*7,{type:"triangle",vol:0.07,bus:bgmBus,attack:0.08}))}
        if(step%2===1&&Math.random()<0.5)tone(hz([69,72,76,79][Math.floor(Math.random()*4)]),next,0.5,{type:"sine",vol:0.06,bus:bgmBus});
      }else if(bgmMode==="run"){
        const el=(performance.now()-runStart)/1000;const lv=Math.min(4,Math.floor(el/2.5));
        dur=60/runBpm/2;
        const b=runBass[step%8];
        tone(hz(b),next,dur*0.9,{type:"sawtooth",vol:0.2,bus:bgmBus,lp:700+lv*300});
        tone(hz(b-12),next,dur*0.9,{type:"triangle",vol:0.25,bus:bgmBus});
        if(step%2===1)noise(next,0.04,{vol:0.07+lv*0.02,type:"highpass",f:7000,bus:bgmBus});
        if(step%4===0)tone(55,next,0.18,{vol:0.4,to:40,bus:bgmBus});
        if(lv>=1&&step%8===0){[69,72,76].forEach(m=>tone(hz(m),next,dur*1.6,{type:"sawtooth",vol:0.05,bus:bgmBus,lp:2400}))}
        if(lv>=2&&step%2===0)tone(hz([81,84,88,84][(step/2)%4]),next,dur*0.7,{type:"square",vol:0.05,bus:bgmBus,lp:3000});
        if(lv>=3&&step%4===2)noise(next,0.12,{vol:0.12,f:1800,bus:bgmBus});
        if(lv>=4)tone(hz(93+(step%2)),next,dur*0.5,{type:"square",vol:0.035,bus:bgmBus});
      }else if(bgmMode==="travel"){
        dur=60/150/2;
        const arp=[72,76,79,84,88,84,79,76];tone(hz(arp[step%8]),next,dur*0.9,{type:"square",vol:0.07,bus:bgmBus,lp:4000});
        if(step%4===0)tone(hz(48),next,dur*3,{type:"triangle",vol:0.25,bus:bgmBus});
        if(step%2===1)noise(next,0.03,{vol:0.06,type:"highpass",f:8000,bus:bgmBus});
      }else{dur=0.25}
      step++;next+=dur;}
  },100);
}

/* ---------- シェア・もう一度 ---------- */
let actionsTimer=null;
function showActions(text){
  const url=location.href.split("#")[0];
  shareA.href="https://twitter.com/intent/tweet?text="+encodeURIComponent(text+"\n#ひらめき文庫 #レンジで十秒")+"&url="+encodeURIComponent(url);
  clearTimeout(actionsTimer);actionsTimer=setTimeout(()=>{actions.hidden=false},700);
}
function hideActions(){clearTimeout(actionsTimer);actions.hidden=true}
for(const b of actions.querySelectorAll("a,button"))b.addEventListener("pointerdown",e=>e.stopPropagation());
againBtn.addEventListener("click",e=>{e.stopPropagation();initAudio();reset();});

/* ---------- 3D ---------- */
let renderer;
try{renderer=new THREE.WebGLRenderer({antialias:true})}catch(e){msg.textContent="この端末では3Dが動きませんでした";return}
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
stage.prepend(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x0b0d18);
const space=new THREE.Scene();space.background=new THREE.Color(0x02030a);
let active=scene;
const camera=new THREE.PerspectiveCamera(55,9/16,0.05,3000);
const mat=(c,o)=>new THREE.MeshLambertMaterial(Object.assign({color:c},o||{}));
const basic=c=>new THREE.MeshBasicMaterial({color:c});
function box(w,h,d,c,x,y,z,parent){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),typeof c==="number"?mat(c):c);m.position.set(x,y,z);(parent||scene).add(m);return m}
function ball(r,c,x,y,z,parent){const m=new THREE.Mesh(new THREE.SphereGeometry(r,18,14),typeof c==="number"?mat(c):c);m.position.set(x,y,z);(parent||scene).add(m);return m}
function canvasTex(w,h,draw){const c=document.createElement("canvas");c.width=w;c.height=h;draw(c.getContext("2d"),w,h);const t=new THREE.CanvasTexture(c);t.userData={c};return t}
function textCanvas(text,{size=110,color="#fff",stroke="#1f2430",font="Dela Gothic One",w=640,h=200}={}){

  if(state!=="run")return;
  const t=(performance.now()-tStart)/1000;elapsed=t;state="stopped";clearAll();humStop();sparkOn=false;
  inLight.intensity=0.4;inGlow.material.opacity=0.12;setBig("ストップ","stop",true);
  drawDisp(t.toFixed(2),"#7dffb0");SE.chin();bgmMode="end";
  const err=Math.abs(t-10);
  let kind=t<9.5?"cold":t<=10.5?"good":t<12.5?"hard":"burnt";
  result={t,err,kind,d:kind==="good"?distFor(err):0};
  later(()=>{doorTarget=-1.75;SE.door()},700);
  if(kind==="good")later(goodResult,1300);
  else later(()=>badResult(kind),1300);
}
function explode(){
  if(state!=="run")return;
  state="stopped";clearAll();humStop();sparkOn=false;boomed=true;elapsed=14;
  SE.boom();shake=0.9;inLight.intensity=0;inGlow.material.opacity=0;setBig("ストップ","stop",true);
  drawDisp("ERR","#ff5a4a");
  // ドアが吹き飛ぶ
  const wp=new THREE.Vector3();door.getWorldPosition(wp);mw.remove(door);scene.add(door);door.position.copy(wp);
  door.userData.v=new THREE.Vector3(0.6,1.6,3.2);door.userData.w=new THREE.Vector3(4,6,2);
  setBunLook("burnt");
  for(let i=0;i<30;i++)puff(new THREE.Vector3(-0.13,1.2,-1.35),0.3+Math.random()*0.4,2.2,new THREE.Vector3((Math.random()-.5)*1.4,0.4+Math.random()*0.8,0.6+Math.random()*1.4),scene,0.75).s.material.color.set(0x3a3a3a);
  pop("ボンッ！！",new THREE.Vector3(0,1.75,-1.2),"#ff5a4a",1.4);
  result={t:14,err:4,kind:"boom",d:0};
  bgmMode="end";later(()=>badResult("boom"),1400);
}
function finishCommon(){
  state="end";setBig("スタート","",true);
  if(result.kind==="good"){
    let upd=[];
    if(best===null||result.err<best){best=result.err;upd.push("誤差");try{localStorage.setItem("hb-renji-err",best.toFixed(3))}catch(e){}}
    if(!bestD||result.d>bestD){bestD=result.d;upd.push("距離");try{localStorage.setItem("hb-renji-dist",String(Math.round(result.d)))}catch(e){}}
    showBest();return upd}
  return []}
function goodResult(){
  setBunLook("fresh");SE.steam();
  for(let i=0;i<16;i++)later(()=>puff(new THREE.Vector3(-0.13+(Math.random()-.5)*0.15,1.08,-1.45+Math.random()*0.1),0.12,1.6,new THREE.Vector3((Math.random()-.5)*0.1,0.35,0.15),scene,0.85),i*60);
  msg.textContent=`${result.t.toFixed(2)} 秒`;rankEl.textContent="ほかほか……いい匂い";
  later(()=>{
    // 香りが旅に出る
    state="travel";bgmMode="travel";SE.whoosh();camMode="toWindow";
    later(()=>{whiteEl.style.transition="opacity .25s";whiteEl.style.opacity="1"},500);
    later(()=>{camMode="outside";travel={u:0,dur:1.6+0.5*Math.log10(Math.max(result.d,10)),passed:0,switched:false,last:0};
      whiteEl.style.transition="opacity .5s";whiteEl.style.opacity="0";},800);
  },1400);
}
function landTitle(d){let t="";for(const [m,l] of LANDS)if(d>=m)t=l;return t||"レンジの前で消えた"}
function endTravel(){
  travel=null;const {t,err,d}=result;const title=landTitle(d);
  SE.fanfare();
  distEl.innerHTML=`${fmtDist(d)}<small>肉まんの香りが届いた距離</small><em>${title}</em>`;
  distEl.classList.remove("slam");void distEl.offsetWidth;distEl.classList.add("slam");
  const rank=err<0.03?"神の体内時計":err<0.1?"レンジの申し子":err<0.25?"台所の常連":"まあまあ温か";
  const upd=finishCommon();
  msg.textContent=`${t.toFixed(2)} 秒（誤差 ${err.toFixed(2)} 秒）`;
  rankEl.textContent=rank+(upd.length?`　${upd.join("・")}ベスト更新！`:"");
  showActions(`壊れたレンジで体感10秒チン！\n${t.toFixed(2)}秒（誤差${err.toFixed(2)}秒）で、肉まんの香りが${fmtDist(d)}先まで届いた【${rank}】`);
}
function badResult(kind){
  const t=result.t;finishCommon();SE.sting();
  const at=new THREE.Vector3(-0.13,1.3,-1.3);
  if(kind==="cold"){setBunLook("cold");SE.cold();pop("ひえっ",at,"#cfe3f5",0.8);
    for(let i=0;i<8;i++){const s=sprite("❄",0.25,{size:150,color:"#e8f6ff",stroke:"#5a8ab0",w:200,h:200});s.position.set(-0.13+(Math.random()-.5)*0.4,1.05+Math.random()*0.2,-1.4);addFx(s,1.6,new THREE.Vector3(0,0.12,0.1))}
    msg.textContent=`${t.toFixed(2)} 秒`;rankEl.textContent="中がまだ冷たい【冷凍のまま】";
    showActions(`壊れたレンジで体感10秒チン…\n${t.toFixed(2)}秒で止めたら、肉まんの中が冷たいまま【冷凍のまま】`)}
  if(kind==="hard"){setBunLook("hard");SE.clunk();pop("カッチカチ",at,"#c9b48a",0.9);
    msg.textContent=`${t.toFixed(2)} 秒`;rankEl.textContent="肉まんが石になった【石になった肉まん】";
    showActions(`壊れたレンジで体感10秒チン…\n${t.toFixed(2)}秒も温めて、肉まんがカッチカチ【石になった肉まん】`)}
  if(kind==="burnt"){setBunLook("burnt");SE.clunk();pop("黒こげ",at,"#ff8a3d",0.9);
    for(let i=0;i<10;i++)later(()=>puff(new THREE.Vector3(-0.13,1.1,-1.4),0.15,1.8,new THREE.Vector3((Math.random()-.5)*0.1,0.3,0.15),scene,0.7).s.material.color.set(0x444444),i*80);
    msg.textContent=`${t.toFixed(2)} 秒`;rankEl.textContent="火花が散る寸前【黒こげ職人】";
    showActions(`壊れたレンジで体感10秒チン…\n${t.toFixed(2)}秒で止めたら、肉まんが黒こげ【黒こげ職人】`)}
  if(kind==="boom"){
    msg.textContent="止めそびれた";rankEl.textContent="レンジが爆発した【レンジ爆発】";
    showActions("壊れたレンジで体感10秒チン…\n止めそびれてレンジが爆発した【レンジ爆発】")}
  later(()=>setBig("スタート","",true),0);
}

/* ---------- 入力 ---------- */
function press(){initAudio();if(state==="idle")start();else if(state==="run")stopMw()}
bigBtn.addEventListener("pointerdown",e=>{e.preventDefault();press()});
bigBtn.addEventListener("keydown",e=>{if(e.code==="Enter"||e.code==="Space"){e.preventDefault();press()}});
stage.addEventListener("pointerdown",e=>{if(e.target.closest&&e.target.closest(".actions"))return;press()});
document.addEventListener("keydown",e=>{if(e.target===bigBtn)return;if(e.code==="Space"||e.code==="Enter"){if(e.target.closest&&e.target.closest(".actions"))return;e.preventDefault();
  if(state==="end"){initAudio();reset();return}press()}});

/* ---------- 毎フレーム ---------- */
const CAM_K={pos:new THREE.Vector3(0.38,1.5,0.75),look:new THREE.Vector3(-0.04,1.13,-1.55)};
const CAM_W={pos:new THREE.Vector3(-1.6,1.68,-0.2),look:new THREE.Vector3(-3.2,1.75,0.2)};
const camLook=CAM_K.look.clone();camera.position.copy(CAM_K.pos);
const tmp=new THREE.Vector3();
let last=performance.now();
function tipAt(d){
  if(d<=1000){const k=d;return new THREE.Vector3(-2.7-k*0.55,1.7+k*0.32,-k*0.35)}
  const s=(d-1000)*10/6.371e6;return P0.clone().addScaledVector(DIR,s)}
function tick(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  const ease=r=>1-Math.exp(-dt*r);
  if(state==="run"){turn.rotation.y+=dt*1.1;elapsed=(now-tStart)/1000;
    if(Math.floor(now/500)%2)drawDispMaybe("--:--");else drawDispMaybe("-- --");
    if(sparkOn&&Math.random()<0.35){const s=sprite("✦",0.12,{size:150,color:"#bfe6ff",stroke:"#fff",w:200,h:200});s.position.set(-0.13+(Math.random()-.5)*0.4,1.0+Math.random()*0.35,-1.45);addFx(s,0.25,new THREE.Vector3(0,0,0));if(Math.random()<0.2)SE.spark()}}
  door.rotation.y+=(doorTarget-door.rotation.y)*ease(10);
  if(door.userData.v&&door.parent===scene){door.userData.v.y-=9.8*dt;door.position.addScaledVector(door.userData.v,dt);
    door.rotation.x+=door.userData.w.x*dt;door.rotation.z+=door.userData.w.z*dt;if(door.position.y<0.02){door.position.y=0.02;door.userData.v.set(0,0,0);door.userData.w.set(0,0,0)}}
  // 香りの旅
  if(travel){
    travel.u=Math.min(1,travel.u+dt/travel.dur);
    const e=travel.u<1?1-Math.pow(1-travel.u,2.2):1;
    const D=result.d,cur=Math.pow(10,e*Math.log10(Math.max(D,1.0001)));
    while(travel.passed<LANDS.length&&cur>=LANDS[travel.passed][0]&&D>=LANDS[travel.passed][0]){
      landEl.textContent=LANDS[travel.passed][1];landEl.classList.remove("show");void landEl.offsetWidth;landEl.classList.add("show");SE.pass(travel.passed);travel.passed++}
    distEl.innerHTML=`${fmtDist(cur)}<small>肉まんの香りが届いた距離</small>`;
    if(cur>1000&&!travel.switched){travel.switched=true;active=space;clearFx();
      whiteEl.style.transition="none";whiteEl.style.opacity="1";requestAnimationFrame(()=>{whiteEl.style.transition="opacity .6s";whiteEl.style.opacity="0"});SE.whoosh()}
    const tip=tipAt(cur);
    if(now-travel.last>30){travel.last=now;
      if(active===scene)puff(tip,0.8+cur*0.04,2.2,new THREE.Vector3(0,0.2,0),scene,0.75);
      else{const s=(cur-1000)*10/6.371e6;puff(tip,0.5+s*0.05,4,new THREE.Vector3(0,0,0),space,0.8)}}
    travel.tip=tip;travel.cur=cur;
    if(travel.u>=1&&!travel.done){travel.done=true;later(endTravel,250)}
  }
  // カメラ
  let gp,gl;
  if(camMode==="kitchen"){gp=CAM_K.pos;gl=CAM_K.look}
  else if(camMode==="toWindow"){gp=CAM_W.pos;gl=CAM_W.look}
  else if(camMode==="outside"&&result){
    const cur=travel&&travel.cur?travel.cur:result.d;const tip=travel&&travel.tip?travel.tip:tipAt(cur);
    if(active===scene){gl=tip;gp=tip.clone().add(tmp.set(cur*0.45+3,cur*0.3+1.8,cur*0.75+5))}
    else{const s=(cur-1000)*10/6.371e6;const side=new THREE.Vector3(1,-0.25,-0.3).normalize();
      gl=P0.clone().multiplyScalar(0.3).add(tip.clone().multiplyScalar(0.7));gp=gl.clone().addScaledVector(side,22+s*0.55).add(new THREE.Vector3(0,4+s*0.12,0))}
  }else{gp=camera.position.clone();gl=camLook.clone()}
  const snap=camMode==="outside"&&travel&&travel.u<0.03;
  if(snap){camera.position.copy(gp);camLook.copy(gl)}
  else{camera.position.lerp(gp,ease(camMode==="outside"?6:3.5));camLook.lerp(gl,ease(camMode==="outside"?8:4))}
  if(shake>0){shake-=dt;camera.position.x+=(Math.random()-.5)*shake*0.25;camera.position.y+=(Math.random()-.5)*shake*0.25}
  camera.lookAt(camLook);
  if(active===space)earth.rotation.y+=dt*0.02;
  for(let i=fx.length-1;i>=0;i--){const f=fx[i];f.t+=dt;f.s.position.addScaledVector(f.vel,dt);
    if(f.grow){const k=f.base+f.grow*(f.t/f.life);f.s.scale.set(k,k,1)}
    const op=f.op||1;f.s.material.opacity=op*Math.max(0,1-Math.max(0,f.t-f.life*0.55)/(f.life*0.45));
    if(f.t>=f.life){f.parent.remove(f.s);fx.splice(i,1)}}
  renderer.render(active,camera);
  requestAnimationFrame(tick);
}
let lastDisp="";function drawDispMaybe(s){if(s!==lastDisp){lastDisp=s;drawDisp(s,"#ff5a4a")}}
function resize(){const r=stage.getBoundingClientRect();if(!r.width||!r.height)return;
  renderer.setSize(r.width,r.height,false);camera.aspect=r.width/r.height;camera.updateProjectionMatrix()}
new ResizeObserver(resize).observe(stage);resize();
reset();
requestAnimationFrame(tick);
})();
</script>
</body>
